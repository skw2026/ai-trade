name: ${AI_TRADE_COMPOSE_PROJECT_NAME:-ai-trade}

services:
  ai-trade:
    image: ${AI_TRADE_IMAGE:-ai-trade:latest}
    container_name: ai-trade
    restart: unless-stopped
    command:
      - "--config=${AI_TRADE_CONFIG_PATH:-config/bybit.demo.s5.yaml}"
      - "--exchange=${AI_TRADE_EXCHANGE:-bybit}"
      - "--run_forever"
    environment:
      AI_TRADE_BYBIT_TESTNET_API_KEY: ${AI_TRADE_BYBIT_TESTNET_API_KEY:-}
      AI_TRADE_BYBIT_TESTNET_API_SECRET: ${AI_TRADE_BYBIT_TESTNET_API_SECRET:-}
      AI_TRADE_BYBIT_DEMO_API_KEY: ${AI_TRADE_BYBIT_DEMO_API_KEY:-}
      AI_TRADE_BYBIT_DEMO_API_SECRET: ${AI_TRADE_BYBIT_DEMO_API_SECRET:-}
      # Legacy migration fallback; the runtime remains locked to Demo config
      # and dedicated mainnet variables are intentionally never injected.
      AI_TRADE_API_KEY: ${AI_TRADE_API_KEY:-}
      AI_TRADE_API_SECRET: ${AI_TRADE_API_SECRET:-}
    volumes:
      - ${AI_TRADE_PROJECT_DIR:-.}/data:/app/data
      - ${AI_TRADE_PROJECT_DIR:-.}/config:/app/config:ro
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  ai-trade-research:
    image: ${AI_TRADE_RESEARCH_IMAGE:-ai-trade-research:latest}
    # 如果是本地构建，取消注释下面两行以使用 Dockerfile 的 research target
    # build: { context: ., target: research }
    container_name: ai-trade-research
    restart: "no"
    working_dir: /opt/ai-trade
    entrypoint: ["python3", "tools/integrator_train.py"]
    command: ["--help"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${AI_TRADE_PROJECT_DIR:-.}:/opt/ai-trade
    profiles: ["research"]

  market-alpha-collector:
    image: ${AI_TRADE_RESEARCH_IMAGE:-ai-trade-research:latest}
    container_name: ai-trade-market-alpha-collector
    restart: unless-stopped
    working_dir: /app
    entrypoint: ["python3", "/app/tools/run_microstructure_collector.py", "run"]
    command:
      - "--root=/app/data/research/microstructure"
      - "--symbol=SOLUSDT"
      - "--bootstrap-segment-duration-sec=${MARKET_ALPHA_BOOTSTRAP_SEGMENT_DURATION_SEC:-65}"
      # Persist completed evidence often enough that normal CD churn cannot
      # repeatedly discard an hour-long in-progress capture.
      - "--segment-duration-sec=${MARKET_ALPHA_SEGMENT_DURATION_SEC:-905}"
      - "--retention-days=${MARKET_ALPHA_RETENTION_DAYS:-120}"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${AI_TRADE_DATA_DIR:-/opt/ai-trade/data}:/app/data
    healthcheck:
      test: ["CMD", "python3", "/app/tools/run_microstructure_collector.py", "healthcheck", "--root=/app/data/research/microstructure", "--max-stale-sec=1800"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"

  cross-venue-alpha-collector:
    image: ${AI_TRADE_RESEARCH_IMAGE:-ai-trade-research:latest}
    container_name: ai-trade-cross-venue-alpha-collector
    restart: unless-stopped
    working_dir: /app
    entrypoint: ["python3", "/app/tools/run_binance_microstructure_collector.py", "run"]
    command:
      - "--root=/app/data/research/binance_sol_microstructure"
      - "--bootstrap-segment-duration-sec=${CROSS_VENUE_BOOTSTRAP_SEGMENT_DURATION_SEC:-65}"
      - "--segment-duration-sec=${CROSS_VENUE_SEGMENT_DURATION_SEC:-905}"
      - "--retention-days=${CROSS_VENUE_RETENTION_DAYS:-120}"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${AI_TRADE_DATA_DIR:-/opt/ai-trade/data}:/app/data
    healthcheck:
      test: ["CMD", "python3", "/app/tools/run_binance_microstructure_collector.py", "healthcheck", "--root=/app/data/research/binance_sol_microstructure", "--max-stale-sec=1800"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"

  microstructure-demo-policy:
    image: ${AI_TRADE_RESEARCH_IMAGE:-ai-trade-research:latest}
    container_name: ai-trade-microstructure-demo-policy
    restart: unless-stopped
    working_dir: /app
    entrypoint: ["python3", "/app/tools/microstructure_demo_policy.py", "run"]
    command:
      - "--registry-root=/app/data/models/microstructure_alpha_lifecycle"
      - "--signal-output=/app/data/runtime/microstructure_demo_signal.json"
      - "--health-output=/app/data/runtime/microstructure_demo_policy_health.json"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${AI_TRADE_DATA_DIR:-/opt/ai-trade/data}:/app/data
    healthcheck:
      test: ["CMD", "python3", "/app/tools/microstructure_demo_policy.py", "healthcheck", "--health-output=/app/data/runtime/microstructure_demo_policy_health.json", "--max-stale-ms=10000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"

  watchdog:
    image: ${AI_TRADE_IMAGE:-ai-trade:latest}
    container_name: ai-trade-watchdog
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "while true; do python3 /app/ops/watchdog.py || echo '[Watchdog] Process exited with error'; sleep 60; done"]
    environment:
      AI_TRADE_WEBHOOK_URL: ${AI_TRADE_WEBHOOK_URL:-}
      AI_TRADE_WATCH_SCHEDULER: ${AI_TRADE_WATCH_SCHEDULER:-true}
      AI_TRADE_SCHEDULER_CONTAINER_NAME: ${AI_TRADE_SCHEDULER_CONTAINER_NAME:-ai-trade-scheduler}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    working_dir: /app
    depends_on:
      - ai-trade
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"

  scheduler:
    image: docker:cli
    container_name: ai-trade-scheduler
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        if ! command -v bash >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1 || ! command -v python3 >/dev/null 2>&1 || ! command -v flock >/dev/null 2>&1; then
          apk add --no-cache bash docker-cli-compose python3 util-linux
        fi

        # Docker socket 嵌套 compose: 需要把宿主机项目绝对路径传给下一层 compose。
        if [ -z "${AI_TRADE_PROJECT_DIR:-}" ]; then
          AI_TRADE_PROJECT_DIR="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/opt/ai-trade"}}{{.Source}}{{end}}{{end}}' ai-trade-scheduler 2>/dev/null || true)"
          export AI_TRADE_PROJECT_DIR
        fi

        ENV_FILE="$${AI_TRADE_ENV_FILE:-.env.runtime}"
        if [ -f "$${ENV_FILE}" ]; then
          ENV_FILE_OPT="--env-file $${ENV_FILE}"
        else
          ENV_FILE_OPT=""
        fi
        SCHEDULER_ACTION_VALUE="$${SCHEDULER_ACTION:-assess}"
        SCHEDULER_INTERVAL_VALUE="$${SCHEDULER_INTERVAL_SECONDS:-86400}"
        # Post-deploy Smoke + Full own the same transaction lock.  Giving them
        # a 30-minute head start prevents the freshly recreated scheduler from
        # racing the deployment verification sequence on every release.
        SCHEDULER_INITIAL_DELAY_VALUE="$${SCHEDULER_INITIAL_DELAY_SECONDS:-1800}"
        SCHEDULER_HEALTH_PATH_VALUE="$${CLOSED_LOOP_SCHEDULER_HEALTH_PATH:-/opt/ai-trade/data/reports/closed_loop/scheduler_health.env}"
        SCHEDULER_CONSECUTIVE_FAILURES=0
        mkdir -p "$$(dirname "$${SCHEDULER_HEALTH_PATH_VALUE}")"
        CLOSED_LOOP_EXECUTED_RELEASE_SHA="$$(python3 -c 'import json; print(json.load(open("release_manifest.json", encoding="utf-8"))["git_sha"])')"
        CLOSED_LOOP_EXECUTED_RELEASE_DIR="$${AI_TRADE_PROJECT_DIR:-/opt/ai-trade}"
        CLOSED_LOOP_RUNNER_SHA256="$$(sha256sum tools/closed_loop_runner.sh | awk '{print $$1}')"
        CLOSED_LOOP_GIT_COMMIT="$${CLOSED_LOOP_EXECUTED_RELEASE_SHA}"
        CLOSED_LOOP_RUNNER_LOCK_PATH="/opt/ai-trade/data/models/closed_loop_runner.lock"
        CLOSED_LOOP_ACTIVATION_TRANSACTION_ROOT="/opt/ai-trade/data/models/activation_transactions"
        CLOSED_LOOP_ACTIVATION_TRANSACTION_STATE_PATH="/opt/ai-trade/data/models/activation_transaction.json"
        CLOSED_LOOP_HOLDOUT_CONSUMPTION_LEDGER_PATH="/opt/ai-trade/data/models/final_holdout_consumption.jsonl"
        export CLOSED_LOOP_EXECUTED_RELEASE_SHA CLOSED_LOOP_EXECUTED_RELEASE_DIR
        export CLOSED_LOOP_RUNNER_SHA256 CLOSED_LOOP_GIT_COMMIT
        export CLOSED_LOOP_RUNNER_LOCK_PATH CLOSED_LOOP_ACTIVATION_TRANSACTION_ROOT
        export CLOSED_LOOP_ACTIVATION_TRANSACTION_STATE_PATH CLOSED_LOOP_HOLDOUT_CONSUMPTION_LEDGER_PATH
        case "$${SCHEDULER_ACTION_VALUE}" in
          train|assess|full|data) ;;
          *)
            echo "[Scheduler] invalid SCHEDULER_ACTION=$${SCHEDULER_ACTION_VALUE}, fallback=assess"
            SCHEDULER_ACTION_VALUE="assess"
            ;;
        esac
        if ! echo "$${SCHEDULER_INTERVAL_VALUE}" | grep -Eq '^[1-9][0-9]*$'; then
          echo "[Scheduler] invalid SCHEDULER_INTERVAL_SECONDS=$${SCHEDULER_INTERVAL_VALUE}, fallback=86400"
          SCHEDULER_INTERVAL_VALUE="86400"
        fi
        if ! echo "$${SCHEDULER_INITIAL_DELAY_VALUE}" | grep -Eq '^[0-9]+$'; then
          echo "[Scheduler] invalid SCHEDULER_INITIAL_DELAY_SECONDS=$${SCHEDULER_INITIAL_DELAY_VALUE}, fallback=1800"
          SCHEDULER_INITIAL_DELAY_VALUE="1800"
        fi

        write_scheduler_health() {
          state_value="$$1"
          started_value="$$2"
          finished_value="$$3"
          exit_value="$$4"
          tmp_path="$${SCHEDULER_HEALTH_PATH_VALUE}.tmp.$$"
          {
            echo "state=$${state_value}"
            echo "last_started_epoch=$${started_value}"
            echo "last_finished_epoch=$${finished_value}"
            echo "last_exit_code=$${exit_value}"
            echo "consecutive_failures=$${SCHEDULER_CONSECUTIVE_FAILURES}"
            echo "release_git_sha=$${CLOSED_LOOP_EXECUTED_RELEASE_SHA}"
            echo "runner_sha256=$${CLOSED_LOOP_RUNNER_SHA256}"
          } > "$${tmp_path}"
          mv -f "$${tmp_path}" "$${SCHEDULER_HEALTH_PATH_VALUE}"
        }

        scheduler_boot_epoch="$$(date +%s)"
        write_scheduler_health sleeping "$${scheduler_boot_epoch}" "$${scheduler_boot_epoch}" 0
        if [ "$${SCHEDULER_INITIAL_DELAY_VALUE}" -gt 0 ]; then
          echo "[Scheduler] Initial deployment-lock delay $${SCHEDULER_INITIAL_DELAY_VALUE}s..."
          sleep "$${SCHEDULER_INITIAL_DELAY_VALUE}"
        fi

        while true; do
          echo "[Scheduler] Starting loop... action=$${SCHEDULER_ACTION_VALUE}"
          started_epoch="$$(date +%s)"
          write_scheduler_health running "$${started_epoch}" 0 0
          job_status=0
          /bin/bash tools/closed_loop_runner.sh "$${SCHEDULER_ACTION_VALUE}" --compose-file docker-compose.prod.yml $${ENV_FILE_OPT} || job_status=$$?
          /bin/bash tools/docker_gc.sh || echo '[Scheduler] Docker GC failed'
          finished_epoch="$$(date +%s)"
          if [ "$${job_status}" -eq 0 ]; then
            SCHEDULER_CONSECUTIVE_FAILURES=0
            write_scheduler_health sleeping "$${started_epoch}" "$${finished_epoch}" 0
          else
            SCHEDULER_CONSECUTIVE_FAILURES=$$((SCHEDULER_CONSECUTIVE_FAILURES + 1))
            write_scheduler_health failed "$${started_epoch}" "$${finished_epoch}" "$${job_status}"
            echo "[Scheduler] Job failed: exit_code=$${job_status}"
          fi
          echo "[Scheduler] Sleeping $${SCHEDULER_INTERVAL_VALUE}s..."
          sleep "$${SCHEDULER_INTERVAL_VALUE}"
        done
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      AI_TRADE_IMAGE: ${AI_TRADE_IMAGE:-ai-trade:latest}
      AI_TRADE_RESEARCH_IMAGE: ${AI_TRADE_RESEARCH_IMAGE:-ai-trade-research:latest}
      AI_TRADE_PROJECT_DIR: ${AI_TRADE_PROJECT_DIR:-}
      AI_TRADE_ENV_FILE: ${AI_TRADE_ENV_FILE:-.env.runtime}
      DATA_PIPELINE_CONFIG: ${DATA_PIPELINE_CONFIG:-config/data_pipeline.yaml}
      SCHEDULER_ACTION: ${SCHEDULER_ACTION:-assess}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-86400}
      SCHEDULER_INITIAL_DELAY_SECONDS: ${SCHEDULER_INITIAL_DELAY_SECONDS:-1800}
      CLOSED_LOOP_SCHEDULER_HEALTH_PATH: ${CLOSED_LOOP_SCHEDULER_HEALTH_PATH:-/opt/ai-trade/data/reports/closed_loop/scheduler_health.env}
      CLOSED_LOOP_SCHEDULER_JOB_TIMEOUT_SECONDS: ${CLOSED_LOOP_SCHEDULER_JOB_TIMEOUT_SECONDS:-4800}
      CLOSED_LOOP_SCHEDULER_HEALTH_GRACE_SECONDS: ${CLOSED_LOOP_SCHEDULER_HEALTH_GRACE_SECONDS:-300}
      CLOSED_LOOP_RUNNER_MAX_SECONDS: ${CLOSED_LOOP_RUNNER_MAX_SECONDS:-4800}
      CLOSED_LOOP_DATA_PIPELINE_BEFORE_TRAIN: ${CLOSED_LOOP_DATA_PIPELINE_BEFORE_TRAIN:-true}
      CLOSED_LOOP_DATA_PIPELINE_REQUIRED: ${CLOSED_LOOP_DATA_PIPELINE_REQUIRED:-true}
      CLOSED_LOOP_DATA_PIPELINE_SKIP_FETCH_ON_SUCCESS: ${CLOSED_LOOP_DATA_PIPELINE_SKIP_FETCH_ON_SUCCESS:-true}
      CLOSED_LOOP_WALKFORWARD_MIN_AVG_SPLIT_RETURN: ${CLOSED_LOOP_WALKFORWARD_MIN_AVG_SPLIT_RETURN:-0.0}
      CLOSED_LOOP_WALKFORWARD_MIN_ENABLED_AVG_SPLIT_RETURN: ${CLOSED_LOOP_WALKFORWARD_MIN_ENABLED_AVG_SPLIT_RETURN:-0.0}
      CLOSED_LOOP_WALKFORWARD_MIN_TRADED_AVG_SPLIT_RETURN: ${CLOSED_LOOP_WALKFORWARD_MIN_TRADED_AVG_SPLIT_RETURN:-0.0}
      CLOSED_LOOP_WALKFORWARD_FOCUS_BUCKET: ${CLOSED_LOOP_WALKFORWARD_FOCUS_BUCKET:-trend}
      CLOSED_LOOP_MAX_AUC_STDEV: ${CLOSED_LOOP_MAX_AUC_STDEV:-0.09}
      CLOSED_LOOP_REPLAY_VALIDATION_ENABLED: ${CLOSED_LOOP_REPLAY_VALIDATION_ENABLED:-true}
      CLOSED_LOOP_ASSESS_REFRESH_REPLAY_VALIDATION: ${CLOSED_LOOP_ASSESS_REFRESH_REPLAY_VALIDATION:-false}
      CLOSED_LOOP_REPLAY_VALIDATION_CONFIG: ${CLOSED_LOOP_REPLAY_VALIDATION_CONFIG:-config/bybit.replay.assess.maker_first.yaml}
      CLOSED_LOOP_REPLAY_VALIDATION_SYMBOL: ${CLOSED_LOOP_REPLAY_VALIDATION_SYMBOL:-}
      CLOSED_LOOP_REPLAY_VALIDATION_SYMBOLS: ${CLOSED_LOOP_REPLAY_VALIDATION_SYMBOLS:-}
      CLOSED_LOOP_REPLAY_VALIDATION_SOURCE_SYMBOL: ${CLOSED_LOOP_REPLAY_VALIDATION_SOURCE_SYMBOL:-}
      CLOSED_LOOP_REPLAY_VALIDATION_REAL_MARKET_FEATURES: ${CLOSED_LOOP_REPLAY_VALIDATION_REAL_MARKET_FEATURES:-true}
      CLOSED_LOOP_REPLAY_VALIDATION_FEATURE_DAYS: ${CLOSED_LOOP_REPLAY_VALIDATION_FEATURE_DAYS:-0}
      CLOSED_LOOP_REPLAY_VALIDATION_TARGET_BUCKET: ${CLOSED_LOOP_REPLAY_VALIDATION_TARGET_BUCKET:-trend}
      CLOSED_LOOP_REPLAY_VALIDATION_MAX_SEGMENTS: ${CLOSED_LOOP_REPLAY_VALIDATION_MAX_SEGMENTS:-16}
      CLOSED_LOOP_REPLAY_VALIDATION_MIN_SEGMENT_BARS: ${CLOSED_LOOP_REPLAY_VALIDATION_MIN_SEGMENT_BARS:-40}
      CLOSED_LOOP_REPLAY_VALIDATION_CORPUS_PATH: ${CLOSED_LOOP_REPLAY_VALIDATION_CORPUS_PATH:-data/research/replay_validation_trend_corpus.json}
      CLOSED_LOOP_REPLAY_VALIDATION_MIN_EXECUTION_ACTIVE_RUNS: ${CLOSED_LOOP_REPLAY_VALIDATION_MIN_EXECUTION_ACTIVE_RUNS:-3}
      CLOSED_LOOP_REPLAY_VALIDATION_MIN_EXECUTION_PASS_RUNS: ${CLOSED_LOOP_REPLAY_VALIDATION_MIN_EXECUTION_PASS_RUNS:-3}
      CLOSED_LOOP_REPLAY_VALIDATION_MIN_TOTAL_FILLS: ${CLOSED_LOOP_REPLAY_VALIDATION_MIN_TOTAL_FILLS:-20}
      CLOSED_LOOP_REPLAY_VALIDATION_MIN_MEAN_REALIZED_NET_PER_FILL: ${CLOSED_LOOP_REPLAY_VALIDATION_MIN_MEAN_REALIZED_NET_PER_FILL:-0.0}
      CLOSED_LOOP_REPLAY_VALIDATION_MIN_BREAK_EVEN_FEE_MULTIPLIER: ${CLOSED_LOOP_REPLAY_VALIDATION_MIN_BREAK_EVEN_FEE_MULTIPLIER:-1.25}
      CLOSED_LOOP_REPLAY_VALIDATION_WARN_MEAN_FILTERED_COST_RATIO: ${CLOSED_LOOP_REPLAY_VALIDATION_WARN_MEAN_FILTERED_COST_RATIO:-0.80}
      CLOSED_LOOP_REPLAY_VALIDATION_MIN_TRADABLE_SYMBOLS: ${CLOSED_LOOP_REPLAY_VALIDATION_MIN_TRADABLE_SYMBOLS:-1}
      CLOSED_LOOP_STRATEGY_DIAGNOSE_TOURNAMENT_HORIZONS: ${CLOSED_LOOP_STRATEGY_DIAGNOSE_TOURNAMENT_HORIZONS:-6,12,24}
      CLOSED_LOOP_STRATEGY_DIAGNOSE_MAKER_ROUND_TRIP_COST_BPS: ${CLOSED_LOOP_STRATEGY_DIAGNOSE_MAKER_ROUND_TRIP_COST_BPS:-3.5}
      CLOSED_LOOP_STRATEGY_DIAGNOSE_STRESS_COST_MULTIPLIER: ${CLOSED_LOOP_STRATEGY_DIAGNOSE_STRESS_COST_MULTIPLIER:-1.25}
      CLOSED_LOOP_ALPHA_MECHANISM_PROBE_ENABLED: ${CLOSED_LOOP_ALPHA_MECHANISM_PROBE_ENABLED:-auto}
      CLOSED_LOOP_ALPHA_MECHANISM_PROBE_ROUND_TRIP_COST_BPS: ${CLOSED_LOOP_ALPHA_MECHANISM_PROBE_ROUND_TRIP_COST_BPS:-13.0}
      CLOSED_LOOP_ALPHA_MECHANISM_PROBE_MIN_HOLDOUT_SAMPLES: ${CLOSED_LOOP_ALPHA_MECHANISM_PROBE_MIN_HOLDOUT_SAMPLES:-100}
      CLOSED_LOOP_ALPHA_MECHANISM_PROBE_OBJECTIVE_MODE: ${CLOSED_LOOP_ALPHA_MECHANISM_PROBE_OBJECTIVE_MODE:-path_first_touch}
      CLOSED_LOOP_ALPHA_MECHANISM_PROBE_PATH_HORIZON_BARS: ${CLOSED_LOOP_ALPHA_MECHANISM_PROBE_PATH_HORIZON_BARS:-12}
      CLOSED_LOOP_ALPHA_MECHANISM_PROBE_PATH_TAKE_PROFIT_BPS: ${CLOSED_LOOP_ALPHA_MECHANISM_PROBE_PATH_TAKE_PROFIT_BPS:-32.0}
      CLOSED_LOOP_ALPHA_MECHANISM_PROBE_PATH_STOP_LOSS_BPS: ${CLOSED_LOOP_ALPHA_MECHANISM_PROBE_PATH_STOP_LOSS_BPS:-20.0}
      CLOSED_LOOP_ALPHA_MECHANISM_PROBE_MIN_MFE_COST_COVERAGE: ${CLOSED_LOOP_ALPHA_MECHANISM_PROBE_MIN_MFE_COST_COVERAGE:-1.2}
      CLOSED_LOOP_MARKET_ALPHA_DEVELOPMENT_ENABLED: ${CLOSED_LOOP_MARKET_ALPHA_DEVELOPMENT_ENABLED:-true}
      CLOSED_LOOP_MARKET_ALPHA_DEVELOPMENT_ITERATIONS: ${CLOSED_LOOP_MARKET_ALPHA_DEVELOPMENT_ITERATIONS:-100}
      CLOSED_LOOP_MARKET_ALPHA_DEVELOPMENT_CACHE_DIR: ${CLOSED_LOOP_MARKET_ALPHA_DEVELOPMENT_CACHE_DIR:-data/research/market_alpha_cache}
      CLOSED_LOOP_MICROSTRUCTURE_CAPTURE_ROOT: ${CLOSED_LOOP_MICROSTRUCTURE_CAPTURE_ROOT:-data/research/microstructure}
      CLOSED_LOOP_MICROSTRUCTURE_MIN_CAPTURE_SECONDS: ${CLOSED_LOOP_MICROSTRUCTURE_MIN_CAPTURE_SECONDS:-86400}
      CLOSED_LOOP_MICROSTRUCTURE_MAX_STALE_SECONDS: ${CLOSED_LOOP_MICROSTRUCTURE_MAX_STALE_SECONDS:-1800}
      CLOSED_LOOP_BLOCK_REGISTRY_ON_ALPHA_FAIL: ${CLOSED_LOOP_BLOCK_REGISTRY_ON_ALPHA_FAIL:-true}
      CLOSED_LOOP_ACTIVATION_MIN_CANARY_EPISODES: ${CLOSED_LOOP_ACTIVATION_MIN_CANARY_EPISODES:-30}
      CLOSED_LOOP_ACTIVATION_MIN_POSITIVE_EPISODE_RATIO: ${CLOSED_LOOP_ACTIVATION_MIN_POSITIVE_EPISODE_RATIO:-0.50}
      CLOSED_LOOP_ACTIVATION_MIN_MEAN_REALIZED_NET_PER_FILL_USD: ${CLOSED_LOOP_ACTIVATION_MIN_MEAN_REALIZED_NET_PER_FILL_USD:-0.0}
      CLOSED_LOOP_ACTIVATION_MAX_PENDING_HOURS: ${CLOSED_LOOP_ACTIVATION_MAX_PENDING_HOURS:-72}
      CLOSED_LOOP_GC_ENABLED: ${CLOSED_LOOP_GC_ENABLED:-true}
      CLOSED_LOOP_GC_KEEP_RUN_DIRS: ${CLOSED_LOOP_GC_KEEP_RUN_DIRS:-120}
      CLOSED_LOOP_GC_KEEP_DAILY_FILES: ${CLOSED_LOOP_GC_KEEP_DAILY_FILES:-120}
      CLOSED_LOOP_GC_KEEP_WEEKLY_FILES: ${CLOSED_LOOP_GC_KEEP_WEEKLY_FILES:-104}
      CLOSED_LOOP_GC_MAX_AGE_HOURS: ${CLOSED_LOOP_GC_MAX_AGE_HOURS:-72}
      CLOSED_LOOP_GC_LOG_FILE: ${CLOSED_LOOP_GC_LOG_FILE:-/opt/ai-trade/data/reports/closed_loop/cron.log}
      CLOSED_LOOP_GC_LOG_MAX_BYTES: ${CLOSED_LOOP_GC_LOG_MAX_BYTES:-104857600}
      CLOSED_LOOP_GC_LOG_KEEP_BYTES: ${CLOSED_LOOP_GC_LOG_KEEP_BYTES:-20971520}
      DOCKER_GC_ENABLED: ${DOCKER_GC_ENABLED:-true}
      DOCKER_GC_UNTIL: ${DOCKER_GC_UNTIL:-72h}
      DOCKER_GC_DRY_RUN: ${DOCKER_GC_DRY_RUN:-false}
      DOCKER_GC_PRUNE_CONTAINERS: ${DOCKER_GC_PRUNE_CONTAINERS:-true}
      DOCKER_GC_PRUNE_IMAGES: ${DOCKER_GC_PRUNE_IMAGES:-true}
      DOCKER_GC_PRUNE_BUILD_CACHE: ${DOCKER_GC_PRUNE_BUILD_CACHE:-true}
      DOCKER_GC_PRUNE_NETWORKS: ${DOCKER_GC_PRUNE_NETWORKS:-false}
      DOCKER_GC_PRUNE_VOLUMES: ${DOCKER_GC_PRUNE_VOLUMES:-false}
      DOCKER_GC_KEEP_RECENT_TAGS: ${DOCKER_GC_KEEP_RECENT_TAGS:-8}
      DOCKER_GC_KEEP_REPO_MATCHERS: ${DOCKER_GC_KEEP_REPO_MATCHERS:-ai-trade,ai-trade-research,ai-trade-web}
    volumes:
      - ${AI_TRADE_PROJECT_DIR:-.}:/opt/ai-trade
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /opt/ai-trade
    depends_on:
      - ai-trade
    healthcheck:
      test: ["CMD-SHELL", "/bin/sh tools/scheduler_healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"

  ai-trade-web:
    image: ${AI_TRADE_WEB_IMAGE:-ai-trade-web:latest}
    container_name: ai-trade-web
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      AI_TRADE_REPORTS_ROOT: /opt/ai-trade/data/reports/closed_loop
      AI_TRADE_MODELS_ROOT: /opt/ai-trade/data/models
      AI_TRADE_CONFIG_ROOT: /opt/ai-trade/config
      AI_TRADE_CONTROL_ROOT: /opt/ai-trade/data/control_plane
      AI_TRADE_WEB_API_TITLE: ai-trade control plane
      AI_TRADE_WEB_API_VERSION: v1
      AI_TRADE_WEB_ENABLE_WRITE: ${AI_TRADE_WEB_ENABLE_WRITE:-false}
      AI_TRADE_WEB_ADMIN_TOKEN: ${AI_TRADE_WEB_ADMIN_TOKEN:-}
      AI_TRADE_WEB_REQUIRE_LATEST_PASS: ${AI_TRADE_WEB_REQUIRE_LATEST_PASS:-true}
      AI_TRADE_WEB_ALLOW_PASS_WITH_ACTIONS: ${AI_TRADE_WEB_ALLOW_PASS_WITH_ACTIONS:-false}
      AI_TRADE_WEB_HIGH_RISK_TWO_MAN_RULE: ${AI_TRADE_WEB_HIGH_RISK_TWO_MAN_RULE:-true}
      AI_TRADE_WEB_HIGH_RISK_REQUIRED_APPROVALS: ${AI_TRADE_WEB_HIGH_RISK_REQUIRED_APPROVALS:-2}
      AI_TRADE_WEB_HIGH_RISK_COOLDOWN_SECONDS: ${AI_TRADE_WEB_HIGH_RISK_COOLDOWN_SECONDS:-180}
    volumes:
      - ${AI_TRADE_PROJECT_DIR:-.}/data:/opt/ai-trade/data
      - ${AI_TRADE_PROJECT_DIR:-.}/config:/opt/ai-trade/config
    ports:
      - "${AI_TRADE_WEB_BIND_ADDRESS:-127.0.0.1}:${AI_TRADE_WEB_PORT:-8080}:8080"
    depends_on:
      - ai-trade
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    profiles: ["web"]

  loki:
    image: grafana/loki:2.9.8
    container_name: ai-trade-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ./data/observability/loki:/loki
    ports:
      - "${LOKI_BIND_ADDRESS:-127.0.0.1}:${LOKI_PORT:-3100}:3100"
    profiles: ["obs"]

  promtail:
    image: ${PROMTAIL_IMAGE:-grafana/promtail:3.0.0}
    container_name: ai-trade-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./data/observability/promtail:/tmp/promtail
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    profiles: ["obs"]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ai-trade-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - ./data/observability/prometheus:/prometheus
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - promtail
    profiles: ["obs"]

  grafana:
    image: grafana/grafana:10.4.8
    container_name: ai-trade-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/observability/grafana:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - loki
      - prometheus
    profiles: ["obs"]
