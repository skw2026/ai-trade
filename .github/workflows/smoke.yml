name: Closed Loop Smoke

on:
  workflow_dispatch:
    inputs:
      since:
        description: "日志窗口（例如 15m / 30m）"
        required: true
        default: "15m"
        type: string
      min_runtime_status:
        description: "最小 RUNTIME_STATUS 条数"
        required: true
        default: "10"
        type: string
  workflow_run:
    workflows:
      - CD
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: closed-loop-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 30
    env:
      SMOKE_SINCE: ${{ github.event_name == 'workflow_dispatch' && inputs.since || '15m' }}
      SMOKE_MIN_RUNTIME_STATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.min_runtime_status || '10' }}
      SMOKE_OUTPUT_ROOT: /opt/ai-trade/data/reports/closed_loop_smoke
      SMOKE_RUN_ID: smoke-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      SMOKE_DEPLOY_FRESHNESS_MAX_AGE_SECONDS: "5400"
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SMOKE_EXPECTED_SHA }}

      - name: Check deploy secrets
        run: |
          set -euo pipefail
          test -n "${{ secrets.ECS_HOST }}"
          test -n "${{ secrets.ECS_USER }}"
          test -n "${{ secrets.ECS_SSH_KEY }}"

      - name: Run Smoke on ECS
        uses: appleboy/ssh-action@v1.2.0
        env:
          SMOKE_SINCE: ${{ env.SMOKE_SINCE }}
          SMOKE_MIN_RUNTIME_STATUS: ${{ env.SMOKE_MIN_RUNTIME_STATUS }}
          SMOKE_OUTPUT_ROOT: ${{ env.SMOKE_OUTPUT_ROOT }}
          SMOKE_RUN_ID: ${{ env.SMOKE_RUN_ID }}
          SMOKE_EXPECTED_SHA: ${{ env.SMOKE_EXPECTED_SHA }}
          CLOSED_LOOP_ASSESS_WAIT_TIMEOUT_SECONDS: "900"
          CLOSED_LOOP_ASSESS_WAIT_POLL_SECONDS: "15"
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || 22 }}
          fingerprint: ${{ secrets.ECS_HOST_FINGERPRINT }}
          command_timeout: 20m
          envs: SMOKE_SINCE,SMOKE_MIN_RUNTIME_STATUS,SMOKE_OUTPUT_ROOT,SMOKE_RUN_ID,SMOKE_EXPECTED_SHA,CLOSED_LOOP_ASSESS_WAIT_TIMEOUT_SECONDS,CLOSED_LOOP_ASSESS_WAIT_POLL_SECONDS
          script: |
            set -euo pipefail
            export PYTHONDONTWRITEBYTECODE=1
            DEPLOY_ROOT="/opt/ai-trade"
            RELEASE_DIR="$(readlink -f "${DEPLOY_ROOT}/current")"
            if [[ -z "${RELEASE_DIR}" ||
                  "${RELEASE_DIR}" != "${DEPLOY_ROOT}/releases/${SMOKE_EXPECTED_SHA}" ]]; then
              echo "smoke release mismatch: ${RELEASE_DIR:-<missing>}" >&2
              exit 1
            fi
            RELEASE_MANIFEST="${RELEASE_DIR}/release_manifest.json"
            RELEASE_RUNTIME_IMAGE="$(
              python3 - "${RELEASE_MANIFEST}" "${SMOKE_EXPECTED_SHA}" <<'PY'
            import json
            import re
            import sys
            from pathlib import Path

            manifest_path = Path(sys.argv[1])
            expected_sha = sys.argv[2]
            payload = json.loads(manifest_path.read_text(encoding="utf-8"))
            if payload.get("schema_version") != "ai_trade_release_manifest_v1":
                raise SystemExit("invalid release manifest schema")
            if payload.get("git_sha") != expected_sha:
                raise SystemExit("release manifest git_sha mismatch")
            runtime_image = str(payload.get("images", {}).get("runtime") or "")
            if not re.fullmatch(r"[^\s@]+@sha256:[0-9a-f]{64}", runtime_image):
                raise SystemExit("release runtime image is not digest-pinned")
            print(runtime_image)
            PY
            )"
            set -a && source "${DEPLOY_ROOT}/.env.runtime" && set +a
            if [[ "${AI_TRADE_IMAGE:-}" != "${RELEASE_RUNTIME_IMAGE}" ]]; then
              echo "runtime env/release image mismatch" >&2
              exit 1
            fi
            export AI_TRADE_PROJECT_DIR="${RELEASE_DIR}"
            export AI_TRADE_DATA_DIR="${DEPLOY_ROOT}/data"
            export AI_TRADE_ENV_FILE_HOST="${DEPLOY_ROOT}/.env.runtime"
            export CLOSED_LOOP_RUN_ID="${SMOKE_RUN_ID}"
            export CLOSED_LOOP_GIT_COMMIT="${SMOKE_EXPECTED_SHA}"
            export CLOSED_LOOP_EXECUTED_RELEASE_SHA="${SMOKE_EXPECTED_SHA}"
            export CLOSED_LOOP_EXECUTED_RELEASE_DIR="${RELEASE_DIR}"
            export CLOSED_LOOP_RUNNER_SHA256="$(
              sha256sum "${RELEASE_DIR}/tools/closed_loop_runner.sh" | awk '{print $1}'
            )"
            cd "${RELEASE_DIR}"
            if [[ ! -x tools/closed_loop_runner.sh ]]; then
              echo "closed-loop runner is not executable" >&2
              exit 1
            fi
            runner_status=0
            tools/closed_loop_runner.sh assess \
              --compose-file "${RELEASE_DIR}/docker-compose.prod.yml" \
              --env-file "${DEPLOY_ROOT}/.env.runtime" \
              --output-root "${SMOKE_OUTPUT_ROOT}" \
              --stage SMOKE \
              --since "${SMOKE_SINCE}" \
              --min-runtime-status "${SMOKE_MIN_RUNTIME_STATUS}" \
              || runner_status=$?
            RUN_DIR="${SMOKE_OUTPUT_ROOT}/${SMOKE_RUN_ID}"
            python3 deploy/validate_deploy_gate.py \
              --manifest "${RUN_DIR}/run_manifest.json" \
              --step-status "${RUN_DIR}/step_status.jsonl" \
              --runtime-assess "${RUN_DIR}/runtime_assess.json" \
              --closed-loop-report "${RUN_DIR}/closed_loop_report.json" \
              --expected-run-id "${SMOKE_RUN_ID}" \
              --expected-stage SMOKE
            runtime_verdict="$(
              python3 - "${RUN_DIR}/runtime_assess.json" <<'PY'
            import json
            import sys
            from pathlib import Path

            payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
            print(str(payload.get("verdict") or "").upper())
            PY
            )"
            if [[ "${runtime_verdict}" != "PASS" &&
                  "${runtime_verdict}" != "PASS_WITH_ACTIONS" ]]; then
              echo "smoke runtime verdict failed: ${runtime_verdict:-<missing>}" >&2
              exit 1
            fi
            if (( runner_status != 0 )); then
              echo "smoke runner returned ${runner_status}; accepted only because strict runtime evidence passed and the remaining failure is audit-only"
            fi
            echo "=== smoke closed_loop_report ==="
            cat "${RUN_DIR}/closed_loop_report.json"

      - name: Download Smoke Reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          umask 077
          cat > .artifacts/ecs_key <<'EOF'
          ${{ secrets.ECS_SSH_KEY }}
          EOF
          sed -i 's/\r$//' .artifacts/ecs_key
          chmod 600 .artifacts/ecs_key
          PORT="${{ secrets.ECS_PORT || 22 }}"
          HOST="${{ secrets.ECS_HOST }}"
          USER="${{ secrets.ECS_USER }}"
          REPORT_ROOT="/opt/ai-trade/data/reports/closed_loop_smoke"
          EXPECTED_RUN_ID="${{ env.SMOKE_RUN_ID }}"
          KNOWN_HOSTS_FILE=".artifacts/known_hosts"
          if [[ -z "${HOST}" || -z "${USER}" ]] || \
             ! ssh-keygen -y -f .artifacts/ecs_key >/dev/null 2>&1 || \
             ! ssh-keyscan -p "${PORT}" -t ed25519,ecdsa,rsa "${HOST}" > "${KNOWN_HOSTS_FILE}" 2>/dev/null; then
            cat > .artifacts/smoke_download_status.json <<'EOF'
          {
            "status": "SKIPPED"
          }
          EOF
            rm -f .artifacts/ecs_key "${KNOWN_HOSTS_FILE}"
            exit 0
          fi
          download_failed=0
          fetch_report() {
            local remote_path="$1"
            local local_path="$2"
            if ! scp -i .artifacts/ecs_key -P "${PORT}" \
              -o UserKnownHostsFile="${KNOWN_HOSTS_FILE}" \
              -o StrictHostKeyChecking=yes \
              "${USER}@${HOST}:${remote_path}" "${local_path}"; then
              echo "failed to download ${remote_path}" >&2
              download_failed=1
            fi
          }
          REMOTE_BASE="${REPORT_ROOT}/${EXPECTED_RUN_ID}"
          fetch_report "${REMOTE_BASE}/closed_loop_report.json" \
            ".artifacts/closed_loop_report.json"
          fetch_report "${REMOTE_BASE}/runtime_assess.json" \
            ".artifacts/runtime_assess.json"
          fetch_report "${REMOTE_BASE}/runtime.log" \
            ".artifacts/runtime.log"
          fetch_report "${REMOTE_BASE}/run_manifest.json" \
            ".artifacts/run_manifest.json"
          fetch_report "/opt/ai-trade/current/release_manifest.json" \
            ".artifacts/release_manifest.json"
          if ! ssh -i .artifacts/ecs_key -p "${PORT}" \
            -o UserKnownHostsFile="${KNOWN_HOSTS_FILE}" \
            -o StrictHostKeyChecking=yes \
            "${USER}@${HOST}" \
            "docker inspect --format '{{.Config.Image}}|{{index .Config.Labels \"org.opencontainers.image.revision\"}}|{{.Image}}|{{.State.StartedAt}}|{{.State.Status}}|{{.RestartCount}}' ai-trade" \
            > ".artifacts/container_state.txt"; then
            download_failed=1
          fi
          if ! ssh -i .artifacts/ecs_key -p "${PORT}" \
            -o UserKnownHostsFile="${KNOWN_HOSTS_FILE}" \
            -o StrictHostKeyChecking=yes \
            "${USER}@${HOST}" \
            "grep '^AI_TRADE_IMAGE=' /opt/ai-trade/.env.runtime | tail -n1 | cut -d= -f2-" \
            > ".artifacts/env_image.txt"; then
            download_failed=1
          fi
          if (( download_failed == 0 )); then
            download_status="DONE"
          else
            download_status="FAILED"
          fi
          printf '{\n  "status": "%s",\n  "run_id": "%s"\n}\n' \
            "${download_status}" "${EXPECTED_RUN_ID}" \
            > .artifacts/smoke_download_status.json
          rm -f .artifacts/ecs_key "${KNOWN_HOSTS_FILE}"

      - name: Evaluate Smoke Evidence
        if: always()
        env:
          SMOKE_TRIGGER_MODE: ${{ github.event_name }}
          SMOKE_EXPECTED_SHA: ${{ env.SMOKE_EXPECTED_SHA }}
          SMOKE_EXPECTED_RUN_ID: ${{ env.SMOKE_RUN_ID }}
          SMOKE_DEPLOY_FRESHNESS_MAX_AGE_SECONDS: ${{ env.SMOKE_DEPLOY_FRESHNESS_MAX_AGE_SECONDS }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/evaluate_smoke_freshness.py \
            --artifacts-dir .artifacts \
            --trigger-mode "${SMOKE_TRIGGER_MODE}" \
            --expected-sha "${SMOKE_EXPECTED_SHA}" \
            --expected-run-id "${SMOKE_EXPECTED_RUN_ID}" \
            --max-age-seconds "${SMOKE_DEPLOY_FRESHNESS_MAX_AGE_SECONDS}" \
            --output .artifacts/deploy_freshness.json

      - name: Upload Smoke Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/*.json
            .artifacts/*.txt
            .artifacts/runtime.log
          include-hidden-files: true
          if-no-files-found: warn
