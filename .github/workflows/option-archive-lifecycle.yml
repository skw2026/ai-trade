name: Option Archive Lifecycle Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/option-archive-lifecycle.yml
  workflow_run:
    workflows:
      - CD
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: option-archive-lifecycle-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'push' && github.event.before || github.sha) }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
          github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 30
    env:
      # A workflow-only push audits the still-deployed parent release immediately;
      # workflow_run audits the exact revision whose CD just completed.
      AUDIT_EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'push' && github.event.before || github.sha) }}
      AUDIT_RUN_ID: option-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
      AUDIT_CAPTURE_ROOT: /opt/ai-trade/data/research/bybit_btc_option_vrp_v2
      AUDIT_OUTPUT_ROOT: /opt/ai-trade/data/reports/option_archive_lifecycle
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDIT_EXPECTED_SHA }}

      - name: Check deploy secrets
        run: |
          set -euo pipefail
          test -n "${{ secrets.ECS_HOST }}"
          test -n "${{ secrets.ECS_USER }}"
          test -n "${{ secrets.ECS_SSH_KEY }}"

      - name: Audit aggregate lifecycle coverage on ECS
        uses: appleboy/ssh-action@v1.2.0
        env:
          AUDIT_EXPECTED_SHA: ${{ env.AUDIT_EXPECTED_SHA }}
          AUDIT_RUN_ID: ${{ env.AUDIT_RUN_ID }}
          AUDIT_CAPTURE_ROOT: ${{ env.AUDIT_CAPTURE_ROOT }}
          AUDIT_OUTPUT_ROOT: ${{ env.AUDIT_OUTPUT_ROOT }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || 22 }}
          fingerprint: ${{ secrets.ECS_HOST_FINGERPRINT }}
          command_timeout: 20m
          envs: AUDIT_EXPECTED_SHA,AUDIT_RUN_ID,AUDIT_CAPTURE_ROOT,AUDIT_OUTPUT_ROOT
          script: |
            set -euo pipefail
            export PYTHONDONTWRITEBYTECODE=1
            DEPLOY_ROOT="/opt/ai-trade"
            OUTPUT_DIR="${AUDIT_OUTPUT_ROOT}/${AUDIT_RUN_ID}"
            mkdir -p "${OUTPUT_DIR}"
            REPORT_PATH="${OUTPUT_DIR}/report.json"
            audit_status=0
            (
              RELEASE_DIR="$(readlink -f "${DEPLOY_ROOT}/current")"
              if [[ -z "${RELEASE_DIR}" ||
                    "${RELEASE_DIR}" != "${DEPLOY_ROOT}/releases/${AUDIT_EXPECTED_SHA}" ]]; then
                echo "option archive audit release mismatch: ${RELEASE_DIR:-<missing>}" >&2
                exit 1
              fi
              python3 "${RELEASE_DIR}/deploy/release_integrity.py" \
                --release-dir "${RELEASE_DIR}"
              cd "${RELEASE_DIR}"
              python3 tools/audit_option_archive_lifecycle.py \
                --root "${AUDIT_CAPTURE_ROOT}" \
                --policy config/option_variance_risk_premium_sequential_payoff_v2.json \
                --manifest config/option_variance_risk_premium_sequential_payoff_manifest_v2.json \
                --case config/option_archive_lifecycle_case_v1.json \
                --executed-release-sha "${AUDIT_EXPECTED_SHA}" \
                --output "${REPORT_PATH}"
            ) || audit_status=$?
            if (( audit_status != 0 )) && [[ ! -s "${REPORT_PATH}" ]]; then
              AUDIT_FAILURE_STATUS="${audit_status}" python3 - "${REPORT_PATH}" "${AUDIT_EXPECTED_SHA}" <<'PY'
            import json
            import os
            import sys
            from pathlib import Path

            report = {
                "schema_version": "option_archive_lifecycle_audit_v1",
                "identities": {"executed_release_sha": sys.argv[2]},
                "archive_integrity": {
                    "root_present": False, "valid_segment_count": 0,
                    "invalid_segment_count": 0, "eligible_snapshot_count_all_time": 0,
                    "duplicate_snapshot_count": 0, "checksum_bound_seconds_all_time": 0,
                },
                "lifecycle_coverage": {
                    "observed_snapshot_count": 0, "qualified_snapshot_count": 0,
                    "unqualified_snapshot_count": 0, "paired_option_snapshot_count": 0,
                    "hedge_qualified_snapshot_count": 0, "coverage_gap_count": 0,
                    "maximum_gap_seconds": 0, "last_pair_epoch_ms": None,
                    "last_pair_dte_days": None,
                    "reason_counts": {"REMOTE_AUDIT_COMMAND_FAILED": 1},
                },
                "settlement": {"paired_delivery_evidence_valid": False},
                "decision": "TECHNICALLY_INVALID_ARCHIVE",
                "reason_code": "REMOTE_AUDIT_COMMAND_FAILED",
                "remote_exit_status": int(os.environ["AUDIT_FAILURE_STATUS"]),
                "economic_evidence": False, "promotion_authority": False,
                "demo_activation_authorized": False, "live_activation_authorized": False,
            }
            Path(sys.argv[1]).write_text(
                json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
            )
            PY
            fi
            exit "${audit_status}"

      - name: Download aggregate report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          umask 077
          cat > .artifacts/ecs_key <<'EOF'
          ${{ secrets.ECS_SSH_KEY }}
          EOF
          sed -i 's/\r$//' .artifacts/ecs_key
          chmod 600 .artifacts/ecs_key
          PORT="${{ secrets.ECS_PORT || 22 }}"
          HOST="${{ secrets.ECS_HOST }}"
          USER="${{ secrets.ECS_USER }}"
          KNOWN_HOSTS_FILE=".artifacts/known_hosts"
          if [[ -z "${HOST}" || -z "${USER}" ]] || \
             ! ssh-keygen -y -f .artifacts/ecs_key >/dev/null 2>&1 || \
             ! ssh-keyscan -p "${PORT}" -t ed25519,ecdsa,rsa "${HOST}" > "${KNOWN_HOSTS_FILE}" 2>/dev/null; then
            rm -f .artifacts/ecs_key "${KNOWN_HOSTS_FILE}"
            exit 0
          fi
          REMOTE_REPORT="${AUDIT_OUTPUT_ROOT}/${AUDIT_RUN_ID}/report.json"
          download_status=1
          for attempt in 1 2 3; do
            if scp -i .artifacts/ecs_key -P "${PORT}" \
              -o UserKnownHostsFile="${KNOWN_HOSTS_FILE}" \
              -o StrictHostKeyChecking=yes \
              "${USER}@${HOST}:${REMOTE_REPORT}" .artifacts/report.json; then
              download_status=0
              break
            fi
            echo "aggregate report download attempt ${attempt} failed" >&2
            sleep 10
          done
          rm -f .artifacts/ecs_key "${KNOWN_HOSTS_FILE}"
          exit "${download_status}"

      - name: Validate aggregate report
        if: always()
        id: validate
        env:
          EXPECTED_SHA: ${{ env.AUDIT_EXPECTED_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(".artifacts/report.json")
          if not path.is_file():
              raise SystemExit("aggregate lifecycle report was not downloaded")
          report = json.loads(path.read_text(encoding="utf-8"))
          if report.get("schema_version") != "option_archive_lifecycle_audit_v1":
              raise SystemExit("aggregate lifecycle report schema mismatch")
          if report.get("identities", {}).get("executed_release_sha") != os.environ["EXPECTED_SHA"]:
              raise SystemExit("aggregate lifecycle report release mismatch")
          accepted_decision = report.get("decision") in {
              "PASS_ARCHIVE_LIFECYCLE_ONLY", "INSUFFICIENT_ARCHIVE_LIFECYCLE"
          }
          if report.get("economic_evidence") is not False:
              raise SystemExit("aggregate lifecycle report overclaims economic evidence")
          for field in (
              "promotion_authority", "demo_activation_authorized", "live_activation_authorized"
          ):
              if report.get(field) is not False:
                  raise SystemExit(f"aggregate lifecycle report grants forbidden authority: {field}")
          forbidden = ("scoped_options", "ordered_inputs", "invalid_segments", ".jsonl.xz")
          rendered = json.dumps(report, sort_keys=True)
          if any(value in rendered for value in forbidden):
              raise SystemExit("aggregate lifecycle report leaked raw archive detail")
          print(json.dumps({
              "decision": report["decision"],
              "reason_code": report["reason_code"],
              "coverage": report["lifecycle_coverage"],
              "settlement": report["settlement"],
          }, indent=2, sort_keys=True))

          coverage = report["lifecycle_coverage"]
          integrity = report["archive_integrity"]
          reasons = coverage.get("reason_counts", {})
          reason_index = ".".join(
              f"{key}_{int(value)}"
              for key, value in sorted(
                  reasons.items(), key=lambda item: (-int(item[1]), item[0])
              )[:4]
          ) or "NONE"
          suffix = "--".join((
              report["decision"],
              report["reason_code"],
              f"o{int(coverage['observed_snapshot_count'])}",
              f"q{int(coverage['qualified_snapshot_count'])}",
              f"u{int(coverage['unqualified_snapshot_count'])}",
              f"p{int(coverage['paired_option_snapshot_count'])}",
              f"h{int(coverage['hedge_qualified_snapshot_count'])}",
              f"g{int(coverage['coverage_gap_count'])}",
              f"m{round(float(coverage['maximum_gap_seconds']))}",
              f"l{coverage.get('last_pair_epoch_ms') or 0}",
              f"t{round(float(coverage.get('last_pair_dte_days') or 0) * 86400)}",
              f"s{int(integrity['valid_segment_count'])}_{int(integrity['invalid_segment_count'])}",
              f"d{int(bool(report['settlement']['paired_delivery_evidence_valid']))}",
              f"r-{reason_index}",
          ))
          suffix = suffix.replace("/", "_").replace("\\", "_")[:190]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"artifact_suffix={suffix}\n")
          if not accepted_decision:
              raise SystemExit(f"aggregate lifecycle audit failed: {report.get('decision')}")
          PY

      - name: Upload aggregate lifecycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: option-archive-lifecycle-${{ steps.validate.outputs.artifact_suffix }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/report.json
          if-no-files-found: warn
