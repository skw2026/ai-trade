name: ECS SSH Probe

on:
  push:
    tags:
      - "infra/ecs-ssh-probe/**"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate configured SSH boundary
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT || '22' }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_HOST_FINGERPRINT_SECRET: ${{ secrets.ECS_HOST_FINGERPRINT }}
          ECS_HOST_FINGERPRINT_VAR: ${{ vars.ECS_HOST_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ECS_HOST}"
          test -n "${ECS_USER}"
          test -n "${ECS_SSH_KEY}"
          export ECS_EXPECTED_FINGERPRINT="${ECS_HOST_FINGERPRINT_SECRET:-${ECS_HOST_FINGERPRINT_VAR:-}}"
          python3 - <<'PY'
          import errno
          import os
          import socket
          import sys

          host = os.environ["ECS_HOST"]
          try:
              port = int(os.environ.get("ECS_PORT", "22"))
          except ValueError:
              print("::error title=ECS SSH preflight::stage=config; result=INVALID_PORT")
              raise SystemExit(2)

          try:
              infos = socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)
          except socket.gaierror as exc:
              print(
                  "::error title=ECS SSH preflight::"
                  f"stage=dns; result=RESOLUTION_FAILED; code={exc.errno}"
              )
              raise SystemExit(2)

          addresses = []
          for family, socktype, proto, _, sockaddr in infos:
              key = (family, socktype, proto, sockaddr)
              if key not in addresses:
                  addresses.append(key)
          print(
              "::notice title=ECS SSH preflight::"
              f"stage=dns; result=RESOLVED; address_count={len(addresses)}"
          )

          failures = []
          for family, socktype, proto, sockaddr in addresses:
              sock = socket.socket(family, socktype, proto)
              sock.settimeout(8.0)
              try:
                  sock.connect(sockaddr)
                  try:
                      banner = sock.recv(255)
                  except socket.timeout:
                      banner = b""
                      failures.append("SSH_BANNER_TIMEOUT")
                      continue
                  if banner.startswith(b"SSH-"):
                      print(
                          "::notice title=ECS SSH preflight::"
                          "stage=tcp_banner; result=SSH_BANNER_OK"
                      )
                      raise SystemExit(0)
                  failures.append("SSH_BANNER_EOF" if not banner else "NON_SSH_BANNER")
              except socket.timeout:
                  failures.append("TCP_TIMEOUT")
              except ConnectionRefusedError:
                  failures.append("TCP_REFUSED")
              except OSError as exc:
                  safe_errno = exc.errno if exc.errno is not None else errno.EIO
                  failures.append(f"OS_ERROR_{safe_errno}")
              finally:
                  sock.close()

          result = ",".join(sorted(set(failures))) or "TCP_UNREACHABLE"
          print(
              "::error title=ECS SSH preflight::"
              f"stage=tcp_banner; result={result}"
          )
          raise SystemExit(2)
          PY

          umask 077
          printf '%s\n' "${ECS_SSH_KEY}" > ecs_key
          sed -i 's/\r$//' ecs_key
          if ! ssh-keygen -y -f ecs_key >/dev/null 2>&1; then
            echo "::error title=ECS SSH preflight::stage=private_key; result=INVALID"
            exit 2
          fi
          echo "::notice title=ECS SSH preflight::stage=private_key; result=VALID"

          if ! ssh-keyscan -T 10 -p "${ECS_PORT}" -t ed25519,ecdsa,rsa "${ECS_HOST}" > known_hosts 2>/dev/null; then
            echo "::error title=ECS SSH preflight::stage=host_key; result=KEYSCAN_FAILED"
            exit 2
          fi
          if [[ ! -s known_hosts ]]; then
            echo "::error title=ECS SSH preflight::stage=host_key; result=KEYSCAN_EMPTY"
            exit 2
          fi
          if [[ -z "${ECS_EXPECTED_FINGERPRINT}" ]]; then
            echo "::warning title=ECS SSH preflight::stage=host_key; result=EXPECTED_FINGERPRINT_MISSING; authentication_probe=dynamic_known_hosts"
          else
            if ! ssh-keygen -lf known_hosts | awk '{print $2}' | grep -Fxq "${ECS_EXPECTED_FINGERPRINT}"; then
              echo "::error title=ECS SSH preflight::stage=host_key; result=FINGERPRINT_MISMATCH"
              exit 2
            fi
            echo "::notice title=ECS SSH preflight::stage=host_key; result=FINGERPRINT_MATCH"
          fi

          set +e
          ssh -i ecs_key \
            -p "${ECS_PORT}" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -o UserKnownHostsFile=known_hosts \
            -o StrictHostKeyChecking=yes \
            "${ECS_USER}@${ECS_HOST}" \
            "printf ECS_SSH_PROBE_OK" > ssh_stdout 2> ssh_stderr
          ssh_status=$?
          set -e
          if [[ ${ssh_status} -eq 0 ]] && grep -Fqx 'ECS_SSH_PROBE_OK' ssh_stdout; then
            echo "::notice title=ECS SSH preflight::stage=authentication; result=READ_ONLY_COMMAND_OK"
            exit 0
          fi
          if grep -Fqi 'Permission denied' ssh_stderr; then
            result="AUTH_REJECTED"
          elif grep -Fqi 'REMOTE HOST IDENTIFICATION HAS CHANGED' ssh_stderr; then
            result="HOST_IDENTIFICATION_CHANGED"
          elif grep -Fqi 'Connection refused' ssh_stderr; then
            result="TCP_REFUSED"
          elif grep -Fqi 'Connection timed out' ssh_stderr; then
            result="TCP_TIMEOUT"
          else
            result="SSH_COMMAND_FAILED_${ssh_status}"
          fi
          echo "::error title=ECS SSH preflight::stage=authentication; result=${result}"
          exit 2

      - name: Validate remote closed-loop prerequisites
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT || '22' }}
          ECS_USER: ${{ secrets.ECS_USER }}
          EXPECTED_RELEASE_SHA: f852ef03516d209e5164ca00b861b8d6f1b583c9
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ecs_key \
            -p "${ECS_PORT}" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -o UserKnownHostsFile=known_hosts \
            -o StrictHostKeyChecking=yes \
            "${ECS_USER}@${ECS_HOST}" \
            "bash -s -- '${EXPECTED_RELEASE_SHA}'" > remote_checks <<'REMOTE'
          set -u
          expected_sha="$1"
          deploy_root="/opt/ai-trade"
          release_dir="$(readlink -f "${deploy_root}/current" 2>/dev/null || true)"

          if [[ -n "${release_dir}" &&
                "${release_dir}" == "${deploy_root}/releases/"* &&
                -f "${release_dir}/release_manifest.json" &&
                -f "${release_dir}/.release-content.sha256" ]]; then
            echo "RELEASE_CURRENT=PASS"
          else
            echo "RELEASE_CURRENT=FAIL"
          fi

          release_sha=""
          if [[ -f "${release_dir}/release_manifest.json" ]]; then
            release_sha="$(python3 - "${release_dir}/release_manifest.json" 2>/dev/null <<'PY' || true
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("schema_version") != "ai_trade_release_manifest_v1":
              raise SystemExit(2)
          print(str(payload.get("git_sha") or ""))
          PY
            )"
          fi
          if [[ "${release_sha}" == "${expected_sha}" &&
                "${release_dir}" == "${deploy_root}/releases/${expected_sha}" ]]; then
            echo "RELEASE_IDENTITY=PASS"
          else
            echo "RELEASE_IDENTITY=FAIL"
          fi

          if [[ -n "${release_dir}" ]] &&
             (cd "${release_dir}" && sha256sum -c .release-content.sha256 >/dev/null 2>&1); then
            echo "RELEASE_CONTENT=PASS"
          else
            echo "RELEASE_CONTENT=FAIL"
          fi

          runtime_sha="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' ai-trade 2>/dev/null || true)"
          if [[ "${runtime_sha}" == "${expected_sha}" ]]; then
            echo "RUNTIME_IDENTITY=PASS"
          else
            echo "RUNTIME_IDENTITY=FAIL"
          fi

          if [[ -f "${deploy_root}/.env.runtime" ]] &&
             (set -a; source "${deploy_root}/.env.runtime") >/dev/null 2>&1; then
            echo "ENV_RUNTIME=PASS"
          else
            echo "ENV_RUNTIME=FAIL"
          fi

          if [[ -x "${release_dir}/tools/closed_loop_runner.sh" ]] &&
             bash -n "${release_dir}/tools/closed_loop_runner.sh" >/dev/null 2>&1; then
            echo "RUNNER=PASS"
          else
            echo "RUNNER=FAIL"
          fi

          lock_path="${deploy_root}/data/models/closed_loop_runner.lock"
          if [[ ! -e "${lock_path}" ]]; then
            echo "RUNNER_LOCK=AVAILABLE"
          elif exec 9<"${lock_path}" 2>/dev/null && flock -n 9; then
            echo "RUNNER_LOCK=AVAILABLE"
            flock -u 9 || true
          else
            echo "RUNNER_LOCK=HELD"
          fi

          if [[ -d "${deploy_root}/data/reports/closed_loop" &&
                -w "${deploy_root}/data/reports/closed_loop" ]]; then
            echo "REPORT_ROOT=PASS"
          else
            echo "REPORT_ROOT=FAIL"
          fi

          collector_state="$(docker inspect --format '{{.State.Status}}' ai-trade-option-vrp-collector 2>/dev/null || true)"
          collector_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' ai-trade-option-vrp-collector 2>/dev/null || true)"
          if [[ "${collector_state}" == "running" && "${collector_health}" == "healthy" ]]; then
            echo "OPTION_COLLECTOR=PASS"
          else
            echo "OPTION_COLLECTOR=FAIL"
          fi

          if [[ -d "${deploy_root}/data/research/bybit_btc_option_vrp_v2" ]]; then
            echo "OPTION_CAPTURE_ROOT=PASS"
          else
            echo "OPTION_CAPTURE_ROOT=FAIL"
          fi

          available_kb="$(df -Pk "${deploy_root}/data" 2>/dev/null | awk 'NR==2 {print $4}')"
          if [[ "${available_kb}" =~ ^[0-9]+$ ]] && (( available_kb >= 5242880 )); then
            echo "DATA_DISK=PASS"
          else
            echo "DATA_DISK=FAIL"
          fi
          REMOTE

          failures=0
          while IFS='=' read -r check result; do
            [[ -n "${check}" && -n "${result}" ]] || continue
            case "${result}" in
              PASS|AVAILABLE)
                echo "::notice title=ECS closed-loop prerequisite::check=${check}; result=${result}"
                ;;
              *)
                echo "::error title=ECS closed-loop prerequisite::check=${check}; result=${result}"
                failures=$((failures + 1))
                ;;
            esac
          done < remote_checks
          if (( failures > 0 )); then
            exit 2
          fi
