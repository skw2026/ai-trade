name: ECS SSH Probe

on:
  push:
    tags:
      - "infra/ecs-ssh-probe/**"
      - "infra/ecs-storage-audit/**"
      - "infra/ecs-storage-recovery/**"
      - "infra/ecs-volume-grow/**"
      - "infra/ecs-collector-recovery/**"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate configured SSH boundary
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT || '22' }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_HOST_FINGERPRINT_SECRET: ${{ secrets.ECS_HOST_FINGERPRINT }}
          ECS_HOST_FINGERPRINT_VAR: ${{ vars.ECS_HOST_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ECS_HOST}"
          test -n "${ECS_USER}"
          test -n "${ECS_SSH_KEY}"
          export ECS_EXPECTED_FINGERPRINT="${ECS_HOST_FINGERPRINT_SECRET:-${ECS_HOST_FINGERPRINT_VAR:-}}"
          python3 - <<'PY'
          import errno
          import os
          import socket
          import sys

          host = os.environ["ECS_HOST"]
          try:
              port = int(os.environ.get("ECS_PORT", "22"))
          except ValueError:
              print("::error title=ECS SSH preflight::stage=config; result=INVALID_PORT")
              raise SystemExit(2)

          try:
              infos = socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)
          except socket.gaierror as exc:
              print(
                  "::error title=ECS SSH preflight::"
                  f"stage=dns; result=RESOLUTION_FAILED; code={exc.errno}"
              )
              raise SystemExit(2)

          addresses = []
          for family, socktype, proto, _, sockaddr in infos:
              key = (family, socktype, proto, sockaddr)
              if key not in addresses:
                  addresses.append(key)
          print(
              "::notice title=ECS SSH preflight::"
              f"stage=dns; result=RESOLVED; address_count={len(addresses)}"
          )

          failures = []
          for family, socktype, proto, sockaddr in addresses:
              sock = socket.socket(family, socktype, proto)
              sock.settimeout(8.0)
              try:
                  sock.connect(sockaddr)
                  try:
                      banner = sock.recv(255)
                  except socket.timeout:
                      banner = b""
                      failures.append("SSH_BANNER_TIMEOUT")
                      continue
                  if banner.startswith(b"SSH-"):
                      print(
                          "::notice title=ECS SSH preflight::"
                          "stage=tcp_banner; result=SSH_BANNER_OK"
                      )
                      raise SystemExit(0)
                  failures.append("SSH_BANNER_EOF" if not banner else "NON_SSH_BANNER")
              except socket.timeout:
                  failures.append("TCP_TIMEOUT")
              except ConnectionRefusedError:
                  failures.append("TCP_REFUSED")
              except OSError as exc:
                  safe_errno = exc.errno if exc.errno is not None else errno.EIO
                  failures.append(f"OS_ERROR_{safe_errno}")
              finally:
                  sock.close()

          result = ",".join(sorted(set(failures))) or "TCP_UNREACHABLE"
          print(
              "::error title=ECS SSH preflight::"
              f"stage=tcp_banner; result={result}"
          )
          raise SystemExit(2)
          PY

          umask 077
          printf '%s\n' "${ECS_SSH_KEY}" > ecs_key
          sed -i 's/\r$//' ecs_key
          if ! ssh-keygen -y -f ecs_key >/dev/null 2>&1; then
            echo "::error title=ECS SSH preflight::stage=private_key; result=INVALID"
            exit 2
          fi
          echo "::notice title=ECS SSH preflight::stage=private_key; result=VALID"

          if ! ssh-keyscan -T 10 -p "${ECS_PORT}" -t ed25519,ecdsa,rsa "${ECS_HOST}" > known_hosts 2>/dev/null; then
            echo "::error title=ECS SSH preflight::stage=host_key; result=KEYSCAN_FAILED"
            exit 2
          fi
          if [[ ! -s known_hosts ]]; then
            echo "::error title=ECS SSH preflight::stage=host_key; result=KEYSCAN_EMPTY"
            exit 2
          fi
          if [[ -z "${ECS_EXPECTED_FINGERPRINT}" ]]; then
            echo "::warning title=ECS SSH preflight::stage=host_key; result=EXPECTED_FINGERPRINT_MISSING; authentication_probe=dynamic_known_hosts"
          else
            if ! ssh-keygen -lf known_hosts | awk '{print $2}' | grep -Fxq "${ECS_EXPECTED_FINGERPRINT}"; then
              echo "::error title=ECS SSH preflight::stage=host_key; result=FINGERPRINT_MISMATCH"
              exit 2
            fi
            echo "::notice title=ECS SSH preflight::stage=host_key; result=FINGERPRINT_MATCH"
          fi

          set +e
          ssh -i ecs_key \
            -p "${ECS_PORT}" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -o UserKnownHostsFile=known_hosts \
            -o StrictHostKeyChecking=yes \
            "${ECS_USER}@${ECS_HOST}" \
            "printf ECS_SSH_PROBE_OK" > ssh_stdout 2> ssh_stderr
          ssh_status=$?
          set -e
          if [[ ${ssh_status} -eq 0 ]] && grep -Fqx 'ECS_SSH_PROBE_OK' ssh_stdout; then
            echo "::notice title=ECS SSH preflight::stage=authentication; result=READ_ONLY_COMMAND_OK"
            exit 0
          fi
          if grep -Fqi 'Permission denied' ssh_stderr; then
            result="AUTH_REJECTED"
          elif grep -Fqi 'REMOTE HOST IDENTIFICATION HAS CHANGED' ssh_stderr; then
            result="HOST_IDENTIFICATION_CHANGED"
          elif grep -Fqi 'Connection refused' ssh_stderr; then
            result="TCP_REFUSED"
          elif grep -Fqi 'Connection timed out' ssh_stderr; then
            result="TCP_TIMEOUT"
          else
            result="SSH_COMMAND_FAILED_${ssh_status}"
          fi
          echo "::error title=ECS SSH preflight::stage=authentication; result=${result}"
          exit 2

      - name: Grow ECS partition and EXT filesystem
        if: startsWith(github.ref_name, 'infra/ecs-volume-grow/')
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT || '22' }}
          ECS_USER: ${{ secrets.ECS_USER }}
          EXPECTED_RELEASE_SHA: f852ef03516d209e5164ca00b861b8d6f1b583c9
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ssh -i ecs_key \
            -p "${ECS_PORT}" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -o UserKnownHostsFile=known_hosts \
            -o StrictHostKeyChecking=yes \
            "${ECS_USER}@${ECS_HOST}" \
            "bash -s -- '${EXPECTED_RELEASE_SHA}'" > volume_grow_checks <<'REMOTE'
          set -u
          expected_sha="$1"
          deploy_root="/opt/ai-trade"
          release_dir="$(readlink -f "${deploy_root}/current" 2>/dev/null || true)"
          if [[ "${release_dir}" != "${deploy_root}/releases/${expected_sha}" ]]; then
            echo "VOLUME_GROW_RELEASE=FAIL"
            exit 2
          fi
          echo "VOLUME_GROW_RELEASE=PASS"

          docker_root="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || true)"
          mount_source_raw="$(findmnt -n -o SOURCE -T "${docker_root}" 2>/dev/null || true)"
          mount_source="$(readlink -f "${mount_source_raw}" 2>/dev/null || true)"
          mount_fstype="$(findmnt -n -o FSTYPE -T "${docker_root}" 2>/dev/null || true)"
          parent_name="$(lsblk -n -o PKNAME "${mount_source}" 2>/dev/null | head -1 || true)"
          device_name="$(basename "${mount_source}" 2>/dev/null || true)"
          partition_number="$(cat "/sys/class/block/${device_name}/partition" 2>/dev/null || true)"
          parent_device="/dev/${parent_name}"
          case "${mount_fstype}" in
            ext2|ext3|ext4) ;;
            *) echo "BLOCK_TARGET_VALIDATION=FAIL"; exit 2 ;;
          esac
          if [[ "${mount_source}" != /dev/* || -z "${parent_name}" ||
                ! "${partition_number}" =~ ^[1-9][0-9]*$ ||
                ! -b "${mount_source}" || ! -b "${parent_device}" ]]; then
            echo "BLOCK_TARGET_VALIDATION=FAIL"
            exit 2
          fi
          echo "BLOCK_TARGET_VALIDATION=PASS"

          filesystem_before="$(df -B1 --output=size "${docker_root}" 2>/dev/null | awk 'NR==2 {print $1}')"
          parent_bytes="$(sudo -n blockdev --getsize64 "${parent_device}" 2>/dev/null || true)"
          partition_bytes="$(sudo -n blockdev --getsize64 "${mount_source}" 2>/dev/null || true)"
          if [[ ! "${filesystem_before}" =~ ^[0-9]+$ ||
                ! "${parent_bytes}" =~ ^[0-9]+$ ||
                ! "${partition_bytes}" =~ ^[0-9]+$ ||
                "${parent_bytes}" -le "${partition_bytes}" ]]; then
            echo "BLOCK_GROW_HEADROOM=FAIL"
            exit 2
          fi
          echo "BLOCK_GROW_HEADROOM=PASS"

          if ! command -v growpart >/dev/null 2>&1 ||
             ! command -v resize2fs >/dev/null 2>&1 ||
             ! sudo -n true >/dev/null 2>&1; then
            echo "BLOCK_GROW_TOOLS=FAIL"
            exit 2
          fi
          echo "BLOCK_GROW_TOOLS=PASS"

          if ! sudo -n growpart "${parent_device}" "${partition_number}" >/dev/null 2>&1; then
            echo "PARTITION_GROW=FAIL"
            exit 2
          fi
          echo "PARTITION_GROW=PASS"

          if command -v partprobe >/dev/null 2>&1; then
            sudo -n partprobe "${parent_device}" >/dev/null 2>&1 || true
          fi
          if ! sudo -n resize2fs "${mount_source}" >/dev/null 2>&1; then
            echo "FILESYSTEM_GROW=FAIL"
            exit 2
          fi
          echo "FILESYSTEM_GROW=PASS"

          filesystem_after="$(df -B1 --output=size "${docker_root}" 2>/dev/null | awk 'NR==2 {print $1}')"
          available_after="$(df -Pk "${docker_root}" 2>/dev/null | awk 'NR==2 {printf "%.0f", $4 * 1024}')"
          if [[ ! "${filesystem_after}" =~ ^[0-9]+$ ||
                ! "${available_after}" =~ ^[0-9]+$ ||
                "${filesystem_after}" -le "${filesystem_before}" ||
                "${available_after}" -lt 5368709120 ]]; then
            echo "FILESYSTEM_CAPACITY=FAIL"
            exit 2
          fi
          echo "FILESYSTEM_CAPACITY=PASS"

          if ! docker start ai-trade-option-vrp-collector >/dev/null 2>&1; then
            echo "OPTION_COLLECTOR_START=FAIL"
            exit 2
          fi
          echo "OPTION_COLLECTOR_START=PASS"

          collector_ready=false
          for _ in $(seq 1 24); do
            collector_state="$(docker inspect --format '{{.State.Status}}' ai-trade-option-vrp-collector 2>/dev/null || true)"
            collector_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' ai-trade-option-vrp-collector 2>/dev/null || true)"
            if [[ "${collector_state}" == "running" && "${collector_health}" == "healthy" ]]; then
              collector_ready=true
              break
            fi
            sleep 10
          done
          if [[ "${collector_ready}" != "true" ]]; then
            echo "OPTION_COLLECTOR_HEALTH=FAIL"
            exit 2
          fi
          echo "OPTION_COLLECTOR_HEALTH=PASS"
          REMOTE
          volume_grow_status=$?
          set -e

          failures=0
          while IFS='=' read -r check result; do
            [[ -n "${check}" && -n "${result}" ]] || continue
            case "${result}" in
              PASS)
                echo "::notice title=ECS volume growth::check=${check}; result=${result}"
                ;;
              *)
                echo "::error title=ECS volume growth::check=${check}; result=${result}"
                failures=$((failures + 1))
                ;;
            esac
          done < volume_grow_checks
          if (( failures > 0 || volume_grow_status != 0 )); then
            exit 2
          fi

      - name: Recreate option collector from frozen release
        if: startsWith(github.ref_name, 'infra/ecs-collector-recovery/')
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT || '22' }}
          ECS_USER: ${{ secrets.ECS_USER }}
          EXPECTED_RELEASE_SHA: f852ef03516d209e5164ca00b861b8d6f1b583c9
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ssh -i ecs_key \
            -p "${ECS_PORT}" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -o UserKnownHostsFile=known_hosts \
            -o StrictHostKeyChecking=yes \
            "${ECS_USER}@${ECS_HOST}" \
            "bash -s -- '${EXPECTED_RELEASE_SHA}'" > collector_recovery_checks <<'REMOTE'
          set -u
          expected_sha="$1"
          deploy_root="/opt/ai-trade"
          release_dir="$(readlink -f "${deploy_root}/current" 2>/dev/null || true)"
          env_file="${deploy_root}/.env.runtime"
          evidence_root="${deploy_root}/data/research/bybit_btc_option_vrp_v2"
          if [[ "${release_dir}" != "${deploy_root}/releases/${expected_sha}" ||
                ! -f "${release_dir}/docker-compose.prod.yml" ||
                ! -f "${env_file}" ]]; then
            echo "COLLECTOR_RELEASE=FAIL"
            exit 2
          fi
          echo "COLLECTOR_RELEASE=PASS"

          if [[ ! -d "${evidence_root}" || ! -w "${evidence_root}" ]]; then
            echo "OPTION_EVIDENCE_ROOT=FAIL"
            exit 2
          fi
          echo "OPTION_EVIDENCE_ROOT=PASS"

          available_bytes="$(df -Pk "${deploy_root}/data" 2>/dev/null | awk 'NR==2 {printf "%.0f", $4 * 1024}')"
          if [[ ! "${available_bytes}" =~ ^[0-9]+$ || "${available_bytes}" -lt 5368709120 ]]; then
            echo "DATA_DISK=FAIL"
            exit 2
          fi
          echo "DATA_DISK=PASS"

          recovery_started_epoch="$(date +%s)"
          if ! (set -a; source "${env_file}"; set +a; \
            docker compose \
              --project-name ai-trade \
              --env-file "${env_file}" \
              -f "${release_dir}/docker-compose.prod.yml" \
              up -d --no-deps --force-recreate option-vrp-collector >/dev/null 2>&1); then
            echo "OPTION_COLLECTOR_RECREATE=FAIL"
            exit 2
          fi
          echo "OPTION_COLLECTOR_RECREATE=PASS"

          collector_ready=false
          latest_segment="${evidence_root}/latest_segment.json"
          for _ in $(seq 1 36); do
            collector_state="$(docker inspect --format '{{.State.Status}}' ai-trade-option-vrp-collector 2>/dev/null || true)"
            collector_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' ai-trade-option-vrp-collector 2>/dev/null || true)"
            latest_epoch="$(stat -c %Y "${latest_segment}" 2>/dev/null || true)"
            if [[ "${collector_state}" == "running" && "${collector_health}" == "healthy" &&
                  "${latest_epoch}" =~ ^[0-9]+$ && "${latest_epoch}" -ge "${recovery_started_epoch}" ]]; then
              collector_ready=true
              break
            fi
            sleep 10
          done
          if [[ "${collector_ready}" != "true" ]]; then
            echo "OPTION_COLLECTOR_NEW_SEGMENT=FAIL"
            exit 2
          fi
          echo "OPTION_COLLECTOR_HEALTH=PASS"
          echo "OPTION_COLLECTOR_NEW_SEGMENT=PASS"
          REMOTE
          collector_recovery_status=$?
          set -e

          failures=0
          while IFS='=' read -r check result; do
            [[ -n "${check}" && -n "${result}" ]] || continue
            case "${result}" in
              PASS)
                echo "::notice title=ECS collector recovery::check=${check}; result=${result}"
                ;;
              *)
                echo "::error title=ECS collector recovery::check=${check}; result=${result}"
                failures=$((failures + 1))
                ;;
            esac
          done < collector_recovery_checks
          if (( failures > 0 || collector_recovery_status != 0 )); then
            exit 2
          fi

      - name: Recover bounded image storage and option collector
        if: startsWith(github.ref_name, 'infra/ecs-storage-recovery/')
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT || '22' }}
          ECS_USER: ${{ secrets.ECS_USER }}
          EXPECTED_RELEASE_SHA: f852ef03516d209e5164ca00b861b8d6f1b583c9
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ssh -i ecs_key \
            -p "${ECS_PORT}" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -o UserKnownHostsFile=known_hosts \
            -o StrictHostKeyChecking=yes \
            "${ECS_USER}@${ECS_HOST}" \
            "bash -s -- '${EXPECTED_RELEASE_SHA}'" > recovery_checks <<'REMOTE'
          set -u
          expected_sha="$1"
          deploy_root="/opt/ai-trade"
          release_dir="$(readlink -f "${deploy_root}/current" 2>/dev/null || true)"
          if [[ "${release_dir}" != "${deploy_root}/releases/${expected_sha}" ]]; then
            echo "RECOVERY_RELEASE=FAIL"
            exit 2
          fi
          echo "RECOVERY_RELEASE=PASS"

          evidence_root="${deploy_root}/data/research/bybit_btc_option_vrp_v2"
          if [[ ! -d "${evidence_root}" || ! -w "${evidence_root}" ]]; then
            echo "OPTION_EVIDENCE_ROOT=FAIL"
            exit 2
          fi
          echo "OPTION_EVIDENCE_ROOT=PASS"

          docker_root="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || true)"
          available_before="$(df -Pk "${docker_root}" 2>/dev/null | awk 'NR==2 {printf "%.0f", $4 * 1024}')"
          if [[ ! "${available_before}" =~ ^[0-9]+$ ]]; then
            echo "DISK_MEASUREMENT=FAIL"
            exit 2
          fi

          if ! docker image prune -a -f --filter until=24h >/dev/null 2>&1; then
            echo "UNUSED_IMAGE_GC=FAIL"
            exit 2
          fi
          echo "UNUSED_IMAGE_GC=PASS"

          available_after="$(df -Pk "${docker_root}" 2>/dev/null | awk 'NR==2 {printf "%.0f", $4 * 1024}')"
          if [[ ! "${available_after}" =~ ^[0-9]+$ ]]; then
            echo "DISK_MEASUREMENT=FAIL"
            exit 2
          fi
          if (( available_after > available_before )); then
            echo "DISK_RECLAIM=PASS"
          else
            echo "DISK_RECLAIM=NO_CHANGE"
          fi
          if (( available_after < 5368709120 )); then
            echo "DATA_DISK=FAIL"
            exit 2
          fi
          echo "DATA_DISK=PASS"

          if ! docker start ai-trade-option-vrp-collector >/dev/null 2>&1; then
            echo "OPTION_COLLECTOR_START=FAIL"
            exit 2
          fi
          echo "OPTION_COLLECTOR_START=PASS"

          collector_ready=false
          for _ in $(seq 1 24); do
            collector_state="$(docker inspect --format '{{.State.Status}}' ai-trade-option-vrp-collector 2>/dev/null || true)"
            collector_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' ai-trade-option-vrp-collector 2>/dev/null || true)"
            if [[ "${collector_state}" == "running" && "${collector_health}" == "healthy" ]]; then
              collector_ready=true
              break
            fi
            sleep 10
          done
          if [[ "${collector_ready}" != "true" ]]; then
            echo "OPTION_COLLECTOR_HEALTH=FAIL"
            exit 2
          fi
          echo "OPTION_COLLECTOR_HEALTH=PASS"
          REMOTE
          recovery_status=$?
          set -e

          failures=0
          while IFS='=' read -r check result; do
            [[ -n "${check}" && -n "${result}" ]] || continue
            case "${result}" in
              PASS)
                echo "::notice title=ECS bounded recovery::check=${check}; result=${result}"
                ;;
              NO_CHANGE)
                echo "::warning title=ECS bounded recovery::check=${check}; result=${result}"
                ;;
              *)
                echo "::error title=ECS bounded recovery::check=${check}; result=${result}"
                failures=$((failures + 1))
                ;;
            esac
          done < recovery_checks
          if (( failures > 0 || recovery_status != 0 )); then
            exit 2
          fi

      - name: Classify remote storage pressure
        if: startsWith(github.ref_name, 'infra/ecs-storage-audit/')
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT || '22' }}
          ECS_USER: ${{ secrets.ECS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ecs_key \
            -p "${ECS_PORT}" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -o UserKnownHostsFile=known_hosts \
            -o StrictHostKeyChecking=yes \
            "${ECS_USER}@${ECS_HOST}" \
            "bash -s" > storage_checks <<'REMOTE'
          set -u
          bucket_kb() {
            local value="${1:-}"
            if [[ ! "${value}" =~ ^[0-9]+$ ]]; then
              printf 'UNKNOWN\n'
            elif (( value < 1048576 )); then
              printf 'LT_1_GIB\n'
            elif (( value < 5242880 )); then
              printf '1_TO_5_GIB\n'
            elif (( value < 10485760 )); then
              printf '5_TO_10_GIB\n'
            else
              printf 'GE_10_GIB\n'
            fi
          }

          capacity_bucket_kb() {
            local value="${1:-}"
            if [[ ! "${value}" =~ ^[0-9]+$ ]]; then
              printf 'UNKNOWN\n'
            elif (( value < 10485760 )); then
              printf 'LT_10_GIB\n'
            elif (( value < 20971520 )); then
              printf '10_TO_20_GIB\n'
            elif (( value < 52428800 )); then
              printf '20_TO_50_GIB\n'
            elif (( value < 104857600 )); then
              printf '50_TO_100_GIB\n'
            else
              printf 'GE_100_GIB\n'
            fi
          }

          reclaim_bucket() {
            python3 - "${1:-}" <<'PY'
          import re
          import sys

          raw = sys.argv[1].strip().split(" ", 1)[0]
          match = re.fullmatch(r"([0-9]+(?:\.[0-9]+)?)([KMGTP]?B)", raw, re.I)
          if not match:
              print("UNKNOWN")
              raise SystemExit(0)
          value = float(match.group(1))
          unit = match.group(2).upper()
          factors = {"B": 1, "KB": 1000, "MB": 1000**2, "GB": 1000**3, "TB": 1000**4, "PB": 1000**5}
          size = value * factors[unit]
          if size == 0:
              print("NONE")
          elif size < 1024**3:
              print("LT_1_GIB")
          elif size < 5 * 1024**3:
              print("1_TO_5_GIB")
          elif size < 10 * 1024**3:
              print("5_TO_10_GIB")
          else:
              print("GE_10_GIB")
          PY
          }

          deploy_root="/opt/ai-trade"
          docker_root="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || true)"
          available_kb="$(df -Pk "${docker_root}" 2>/dev/null | awk 'NR==2 {print $4}')"
          total_kb="$(df -Pk "${docker_root}" 2>/dev/null | awk 'NR==2 {print $2}')"
          echo "DISK_FREE_BUCKET=$(bucket_kb "${available_kb}")"
          echo "DISK_TOTAL_BUCKET=$(capacity_bucket_kb "${total_kb}")"

          for entry in \
            "RESEARCH:${deploy_root}/data/research" \
            "REPORTS:${deploy_root}/data/reports" \
            "RELEASES:${deploy_root}/releases" \
            "INCOMING:${deploy_root}/incoming" \
            "RUNTIME_COMPOSE:${deploy_root}/data/deploy-runtime-compose"
          do
            label="${entry%%:*}"
            path="${entry#*:}"
            size_kb="$(timeout 30 du -sk "${path}" 2>/dev/null | awk '{print $1}' || true)"
            echo "${label}_BUCKET=$(bucket_kb "${size_kb}")"
          done

          for entry in \
            "OPTION_V2:${deploy_root}/data/research/bybit_btc_option_vrp_v2" \
            "MICROSTRUCTURE:${deploy_root}/data/research/microstructure" \
            "LIQUIDATIONS:${deploy_root}/data/research/bybit_sol_liquidations"
          do
            label="${entry%%:*}"
            path="${entry#*:}"
            size_kb="$(timeout 30 du -sk "${path}" 2>/dev/null | awk '{print $1}' || true)"
            echo "${label}_BUCKET=$(bucket_kb "${size_kb}")"
          done

          host_log_kb="$(sudo -n timeout 30 du -sk /var/log 2>/dev/null | awk '{print $1}' || true)"
          echo "HOST_LOG_BUCKET=$(bucket_kb "${host_log_kb}")"

          mount_source="$(findmnt -n -o SOURCE -T "${docker_root}" 2>/dev/null || true)"
          mount_fstype="$(findmnt -n -o FSTYPE -T "${docker_root}" 2>/dev/null || true)"
          filesystem_bytes="$(df -B1 --output=size "${docker_root}" 2>/dev/null | awk 'NR==2 {print $1}')"
          device_bytes="$(sudo -n blockdev --getsize64 "${mount_source}" 2>/dev/null || true)"
          parent_name="$(lsblk -n -o PKNAME "${mount_source}" 2>/dev/null | head -1 || true)"
          parent_bytes=""
          if [[ -n "${parent_name}" ]]; then
            parent_bytes="$(sudo -n blockdev --getsize64 "/dev/${parent_name}" 2>/dev/null || true)"
          fi
          case "${mount_fstype}" in
            ext2|ext3|ext4) mount_fstype_class="EXT" ;;
            xfs) mount_fstype_class="XFS" ;;
            *) mount_fstype_class="OTHER" ;;
          esac
          echo "BLOCK_FILESYSTEM_CLASS=${mount_fstype_class}"
          if [[ "${filesystem_bytes}" =~ ^[0-9]+$ && "${device_bytes}" =~ ^[0-9]+$ ]] &&
             (( device_bytes - filesystem_bytes >= 1073741824 )); then
            echo "BLOCK_EXPANSION_HEADROOM=FILESYSTEM_GROW_AVAILABLE"
          elif [[ "${device_bytes}" =~ ^[0-9]+$ && "${parent_bytes}" =~ ^[0-9]+$ ]] &&
               (( parent_bytes - device_bytes >= 1073741824 )); then
            echo "BLOCK_EXPANSION_HEADROOM=PARTITION_GROW_AVAILABLE"
          elif [[ "${filesystem_bytes}" =~ ^[0-9]+$ && "${device_bytes}" =~ ^[0-9]+$ ]]; then
            echo "BLOCK_EXPANSION_HEADROOM=NONE"
          else
            echo "BLOCK_EXPANSION_HEADROOM=UNKNOWN"
          fi

          python3 - <<'PY'
          import datetime as dt
          import json
          import subprocess

          def output(*args):
              return subprocess.run(args, text=True, capture_output=True, check=False).stdout.strip()

          def bucket(size):
              if size <= 0:
                  return "NONE"
              if size < 1024**3:
                  return "LT_1_GIB"
              if size < 5 * 1024**3:
                  return "1_TO_5_GIB"
              if size < 10 * 1024**3:
                  return "5_TO_10_GIB"
              return "GE_10_GIB"

          image_ids = set(filter(None, output("docker", "image", "ls", "-q", "--no-trunc").splitlines()))
          container_ids = list(filter(None, output("docker", "ps", "-aq").splitlines()))
          used_ids = set()
          if container_ids:
              used_ids.update(filter(None, output("docker", "inspect", "--format", "{{.Image}}", *container_ids).splitlines()))
          now = dt.datetime.now(dt.timezone.utc)
          recent_count = old_count = recent_size = old_size = 0
          for image_id in sorted(image_ids - used_ids):
              raw = output("docker", "image", "inspect", "--format", "{{json .}}", image_id)
              if not raw:
                  continue
              payload = json.loads(raw)
              created = dt.datetime.fromisoformat(str(payload["Created"]).replace("Z", "+00:00"))
              size = int(payload.get("Size") or 0)
              if (now - created).total_seconds() >= 86400:
                  old_count += 1
                  old_size += size
              else:
                  recent_count += 1
                  recent_size += size
          print(f"UNUSED_IMAGE_OLD_24H_COUNT={old_count}")
          print(f"UNUSED_IMAGE_RECENT_24H_COUNT={recent_count}")
          print(f"UNUSED_IMAGE_OLD_ESTIMATED_BUCKET={bucket(old_size)}")
          print(f"UNUSED_IMAGE_RECENT_ESTIMATED_BUCKET={bucket(recent_size)}")
          PY

          docker_df="$(docker system df --format '{{.Type}}|{{.Size}}|{{.Reclaimable}}' 2>/dev/null || true)"
          if [[ -n "${docker_df}" ]]; then
            while IFS='|' read -r object_type size reclaimable; do
              safe_type="$(printf '%s' "${object_type}" | tr '[:lower:] ' '[:upper:]_')"
              if [[ -n "${safe_type}" ]]; then
                echo "DOCKER_${safe_type}_ALLOCATED_BUCKET=$(reclaim_bucket "${size}")"
                echo "DOCKER_${safe_type}_RECLAIM_BUCKET=$(reclaim_bucket "${reclaimable}")"
              fi
            done <<< "${docker_df}"
          else
            echo "DOCKER_DF=UNAVAILABLE"
          fi

          collector_state="$(docker inspect --format '{{.State.Status}}' ai-trade-option-vrp-collector 2>/dev/null || true)"
          collector_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' ai-trade-option-vrp-collector 2>/dev/null || true)"
          case "${collector_state}" in
            running|exited|created|restarting|paused|dead) ;;
            *) collector_state="missing_or_unknown" ;;
          esac
          case "${collector_health}" in
            healthy|unhealthy|starting|'') ;;
            *) collector_health="unknown" ;;
          esac
          echo "OPTION_COLLECTOR_STATE=${collector_state}"
          echo "OPTION_COLLECTOR_HEALTH=${collector_health:-none}"

          collector_logs="$(docker logs --tail 120 ai-trade-option-vrp-collector 2>&1 || true)"
          if grep -Fqi 'no space left on device' <<< "${collector_logs}"; then
            echo "OPTION_COLLECTOR_EXIT_CLASS=NO_SPACE"
          elif grep -Eqi 'out of memory|oom|killed' <<< "${collector_logs}"; then
            echo "OPTION_COLLECTOR_EXIT_CLASS=MEMORY_PRESSURE"
          elif grep -Eqi 'rate.?limit|too many requests|http[^0-9]*429' <<< "${collector_logs}"; then
            echo "OPTION_COLLECTOR_EXIT_CLASS=RATE_LIMIT"
          elif grep -Eqi 'permission denied|read-only file system' <<< "${collector_logs}"; then
            echo "OPTION_COLLECTOR_EXIT_CLASS=FILESYSTEM_PERMISSION"
          elif [[ -n "${collector_logs}" ]]; then
            echo "OPTION_COLLECTOR_EXIT_CLASS=OTHER"
          else
            echo "OPTION_COLLECTOR_EXIT_CLASS=NO_LOGS"
          fi
          REMOTE

          while IFS='=' read -r check result; do
            [[ -n "${check}" && -n "${result}" ]] || continue
            case "${check}" in
              OPTION_COLLECTOR_*|DISK_TOTAL_*|OPTION_V2_*|MICROSTRUCTURE_*|LIQUIDATIONS_*|HOST_LOG_*|UNUSED_IMAGE_*|DOCKER_*_ALLOCATED_*|BLOCK_*)
                echo "::warning title=ECS storage audit::check=${check}; result=${result}"
                ;;
              *)
                echo "::notice title=ECS storage audit::check=${check}; result=${result}"
                ;;
            esac
          done < storage_checks

      - name: Validate remote closed-loop prerequisites
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT || '22' }}
          ECS_USER: ${{ secrets.ECS_USER }}
          EXPECTED_RELEASE_SHA: f852ef03516d209e5164ca00b861b8d6f1b583c9
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ecs_key \
            -p "${ECS_PORT}" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -o UserKnownHostsFile=known_hosts \
            -o StrictHostKeyChecking=yes \
            "${ECS_USER}@${ECS_HOST}" \
            "bash -s -- '${EXPECTED_RELEASE_SHA}'" > remote_checks <<'REMOTE'
          set -u
          expected_sha="$1"
          deploy_root="/opt/ai-trade"
          release_dir="$(readlink -f "${deploy_root}/current" 2>/dev/null || true)"

          if [[ -n "${release_dir}" &&
                "${release_dir}" == "${deploy_root}/releases/"* &&
                -f "${release_dir}/release_manifest.json" &&
                -f "${release_dir}/.release-content.sha256" ]]; then
            echo "RELEASE_CURRENT=PASS"
          else
            echo "RELEASE_CURRENT=FAIL"
          fi

          release_sha=""
          if [[ -f "${release_dir}/release_manifest.json" ]]; then
            release_sha="$(python3 - "${release_dir}/release_manifest.json" 2>/dev/null <<'PY' || true
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("schema_version") != "ai_trade_release_manifest_v1":
              raise SystemExit(2)
          print(str(payload.get("git_sha") or ""))
          PY
            )"
          fi
          if [[ "${release_sha}" == "${expected_sha}" &&
                "${release_dir}" == "${deploy_root}/releases/${expected_sha}" ]]; then
            echo "RELEASE_IDENTITY=PASS"
          else
            echo "RELEASE_IDENTITY=FAIL"
          fi

          if [[ -n "${release_dir}" ]] &&
             (cd "${release_dir}" && sha256sum -c .release-content.sha256 >/dev/null 2>&1); then
            echo "RELEASE_CONTENT=PASS"
          else
            echo "RELEASE_CONTENT=FAIL"
          fi

          runtime_sha="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' ai-trade 2>/dev/null || true)"
          if [[ "${runtime_sha}" == "${expected_sha}" ]]; then
            echo "RUNTIME_IDENTITY=PASS"
          else
            echo "RUNTIME_IDENTITY=FAIL"
          fi

          if [[ -f "${deploy_root}/.env.runtime" ]] &&
             (set -a; source "${deploy_root}/.env.runtime") >/dev/null 2>&1; then
            echo "ENV_RUNTIME=PASS"
          else
            echo "ENV_RUNTIME=FAIL"
          fi

          if [[ -x "${release_dir}/tools/closed_loop_runner.sh" ]] &&
             bash -n "${release_dir}/tools/closed_loop_runner.sh" >/dev/null 2>&1; then
            echo "RUNNER=PASS"
          else
            echo "RUNNER=FAIL"
          fi

          lock_path="${deploy_root}/data/models/closed_loop_runner.lock"
          if [[ ! -e "${lock_path}" ]]; then
            echo "RUNNER_LOCK=AVAILABLE"
          elif exec 9<"${lock_path}" 2>/dev/null && flock -n 9; then
            echo "RUNNER_LOCK=AVAILABLE"
            flock -u 9 || true
          else
            echo "RUNNER_LOCK=HELD"
          fi

          if [[ -d "${deploy_root}/data/reports/closed_loop" &&
                -w "${deploy_root}/data/reports/closed_loop" ]]; then
            echo "REPORT_ROOT=PASS"
          else
            echo "REPORT_ROOT=FAIL"
          fi

          collector_state="$(docker inspect --format '{{.State.Status}}' ai-trade-option-vrp-collector 2>/dev/null || true)"
          collector_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' ai-trade-option-vrp-collector 2>/dev/null || true)"
          if [[ "${collector_state}" == "running" && "${collector_health}" == "healthy" ]]; then
            echo "OPTION_COLLECTOR=PASS"
          else
            echo "OPTION_COLLECTOR=FAIL"
          fi

          if [[ -d "${deploy_root}/data/research/bybit_btc_option_vrp_v2" ]]; then
            echo "OPTION_CAPTURE_ROOT=PASS"
          else
            echo "OPTION_CAPTURE_ROOT=FAIL"
          fi

          available_kb="$(df -Pk "${deploy_root}/data" 2>/dev/null | awk 'NR==2 {print $4}')"
          if [[ "${available_kb}" =~ ^[0-9]+$ ]] && (( available_kb >= 5242880 )); then
            echo "DATA_DISK=PASS"
          else
            echo "DATA_DISK=FAIL"
          fi
          REMOTE

          failures=0
          while IFS='=' read -r check result; do
            [[ -n "${check}" && -n "${result}" ]] || continue
            case "${result}" in
              PASS|AVAILABLE)
                echo "::notice title=ECS closed-loop prerequisite::check=${check}; result=${result}"
                ;;
              *)
                echo "::error title=ECS closed-loop prerequisite::check=${check}; result=${result}"
                failures=$((failures + 1))
                ;;
            esac
          done < remote_checks
          if (( failures > 0 )); then
            exit 2
          fi
