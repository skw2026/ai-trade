name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-ecs-cd
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      research_image_uri: ${{ steps.meta.outputs.research_image_uri }}
      research_image_tag: ${{ steps.meta.outputs.research_image_tag }}
      web_image_uri: ${{ steps.meta.outputs.web_image_uri }}
      web_image_tag: ${{ steps.meta.outputs.web_image_tag }}
      runtime_image_digest: ${{ steps.runtime_image.outputs.digest }}
      research_image_digest: ${{ steps.research_image.outputs.digest }}
      web_image_digest: ${{ steps.web_image.outputs.digest }}
      deploy_enabled: ${{ steps.deploy_gate.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-research.txt

      - name: Install Python Test Dependencies
        run: python -m pip install -r tools/requirements-research.txt

      - name: Compute Image Metadata
        id: meta
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_URI="${REGISTRY}/${OWNER_LC}/ai-trade"
          RESEARCH_IMAGE_URI="${REGISTRY}/${OWNER_LC}/ai-trade-research"
          WEB_IMAGE_URI="${REGISTRY}/${OWNER_LC}/ai-trade-web"
          IMAGE_TAG="${GITHUB_SHA}"
          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "research_image_uri=${RESEARCH_IMAGE_URI}" >> "${GITHUB_OUTPUT}"
          echo "research_image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "web_image_uri=${WEB_IMAGE_URI}" >> "${GITHUB_OUTPUT}"
          echo "web_image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Install Build Dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -o Acquire::Retries=3 && \
               sudo apt-get install -y --no-install-recommends \
                 build-essential \
                 cmake \
                 ninja-build \
                 pkg-config \
                 libcurl4-openssl-dev \
                 libssl-dev; then
              break
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              echo "apt dependency install failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Verify Required Tests Registered
        run: |
          set -euo pipefail
          ctest --test-dir build -N > /tmp/ctest-list.txt
          grep -q "trade_system_test" /tmp/ctest-list.txt
          grep -q "assess_run_log_test" /tmp/ctest-list.txt
          grep -q "compose_consistency_test" /tmp/ctest-list.txt
          grep -q "materialize_release_compose_test" /tmp/ctest-list.txt
          grep -q "validate_deploy_gate_test" /tmp/ctest-list.txt
          grep -q "release_integrity_test" /tmp/ctest-list.txt
          grep -q "prune_release_storage_test" /tmp/ctest-list.txt
          grep -q "evaluate_smoke_freshness_test" /tmp/ctest-list.txt
          grep -q "evaluate_demo_incubation_test" /tmp/ctest-list.txt
          grep -q "watchdog_utils_test" /tmp/ctest-list.txt
          grep -q "recycle_artifacts_test" /tmp/ctest-list.txt
          grep -q "docker_gc_test" /tmp/ctest-list.txt
          grep -q "validate_reports_test" /tmp/ctest-list.txt
          grep -q "build_closed_loop_report_test" /tmp/ctest-list.txt
          grep -q "data_pipeline_tools_test" /tmp/ctest-list.txt
          grep -q "fetch_market_alpha_history_test" /tmp/ctest-list.txt
          grep -q "fetch_bybit_trade_history_test" /tmp/ctest-list.txt
          grep -q "collect_bybit_microstructure_test" /tmp/ctest-list.txt
          grep -q "run_market_alpha_development_test" /tmp/ctest-list.txt
          grep -q "run_microstructure_alpha_development_test" /tmp/ctest-list.txt
          grep -q "run_microstructure_alpha_lifecycle_test" /tmp/ctest-list.txt
          grep -q "run_data_pipeline_test" /tmp/ctest-list.txt
          grep -q "feature_parity_contract_test" /tmp/ctest-list.txt
          grep -q "web_report_store_test" /tmp/ctest-list.txt
          grep -q "web_governance_test" /tmp/ctest-list.txt
          grep -q "web_static_test" /tmp/ctest-list.txt

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Runtime Image
        id: runtime_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image_uri }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_uri }}:latest

      - name: Build and Push Research Image
        id: research_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: research
          push: true
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.research_image_uri }}:${{ steps.meta.outputs.research_image_tag }}
            ${{ steps.meta.outputs.research_image_uri }}:latest

      - name: Build and Push Web Image
        id: web_image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/ai_trade_web/backend
          file: ./apps/ai_trade_web/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.web_image_uri }}:${{ steps.meta.outputs.web_image_tag }}
            ${{ steps.meta.outputs.web_image_uri }}:latest

      - name: Compute Deploy Gate
        id: deploy_gate
        run: |
          set -euo pipefail
          if [[ -n "${{ secrets.ECS_HOST }}" && -n "${{ secrets.ECS_USER }}" && -n "${{ secrets.ECS_SSH_KEY }}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "[warn] Deploy skipped: missing ECS_HOST/ECS_USER/ECS_SSH_KEY secrets."
          fi

  deploy-ecs:
    needs: build-test-push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ needs.build-test-push.outputs.deploy_enabled == 'true' }}
    env:
      DEPLOY_RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      DEPLOY_GIT_SHA: ${{ github.sha }}
      RUNTIME_IMAGE_REF: ${{ needs.build-test-push.outputs.image_uri }}@${{ needs.build-test-push.outputs.runtime_image_digest }}
      RESEARCH_IMAGE_REF: ${{ needs.build-test-push.outputs.research_image_uri }}@${{ needs.build-test-push.outputs.research_image_digest }}
      WEB_IMAGE_REF: ${{ needs.build-test-push.outputs.web_image_uri }}@${{ needs.build-test-push.outputs.web_image_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Deployment Bundle
        id: bundle
        run: |
          set -euo pipefail
          RELEASE_ARTIFACT_DIR=".release-artifacts/${DEPLOY_RELEASE_ID}"
          PAYLOAD_DIR="${RELEASE_ARTIFACT_DIR}/payload"
          BUNDLE_PATH="${RELEASE_ARTIFACT_DIR}/deploy_bundle.tgz"
          for image_ref in \
            "${RUNTIME_IMAGE_REF}" \
            "${RESEARCH_IMAGE_REF}" \
            "${WEB_IMAGE_REF}"
          do
            if [[ ! "${image_ref}" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]; then
              echo "image is not digest-pinned: ${image_ref}" >&2
              exit 1
            fi
          done
          rm -rf "${RELEASE_ARTIFACT_DIR}"
          mkdir -p "${PAYLOAD_DIR}/deploy"
          cp -f docker-compose.prod.yml "${PAYLOAD_DIR}/docker-compose.prod.yml"
          cp -f deploy/ecs-deploy.sh "${PAYLOAD_DIR}/deploy/ecs-deploy.sh"
          cp -f deploy/materialize_release_compose.py \
            "${PAYLOAD_DIR}/deploy/materialize_release_compose.py"
          cp -f deploy/validate_deploy_gate.py \
            "${PAYLOAD_DIR}/deploy/validate_deploy_gate.py"
          cp -f deploy/release_integrity.py \
            "${PAYLOAD_DIR}/deploy/release_integrity.py"
          cp -f deploy/prune_release_storage.py \
            "${PAYLOAD_DIR}/deploy/prune_release_storage.py"
          cp -a config observability ops tools "${PAYLOAD_DIR}/"
          python3 deploy/materialize_release_compose.py \
            --input "${PAYLOAD_DIR}/docker-compose.prod.yml" \
            --release-dir "${PAYLOAD_DIR}"

          (
            cd "${PAYLOAD_DIR}"
            find \
              docker-compose.prod.yml \
              deploy \
              config \
              observability \
              ops \
              tools \
              -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > .release-content.sha256
          )
          CONTENT_MANIFEST_SHA256="$(
            sha256sum "${PAYLOAD_DIR}/.release-content.sha256" | awk '{print $1}'
          )"
          CONTENT_MANIFEST_SHA256="${CONTENT_MANIFEST_SHA256}" \
          python3 - "${PAYLOAD_DIR}/release_manifest.json" <<'PY'
          import datetime as dt
          import json
          import os
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          payload = {
              "schema_version": "ai_trade_release_manifest_v1",
              "release_id": os.environ["DEPLOY_RELEASE_ID"],
              "git_sha": os.environ["DEPLOY_GIT_SHA"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "created_at_utc": dt.datetime.now(dt.timezone.utc).strftime(
                  "%Y-%m-%dT%H:%M:%SZ"
              ),
              "content_manifest": {
                  "path": ".release-content.sha256",
                  "sha256": os.environ["CONTENT_MANIFEST_SHA256"],
              },
              "images": {
                  "runtime": os.environ["RUNTIME_IMAGE_REF"],
                  "research": os.environ["RESEARCH_IMAGE_REF"],
                  "web": os.environ["WEB_IMAGE_REF"],
              },
          }
          output.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          tar -C "${PAYLOAD_DIR}" -czf "${BUNDLE_PATH}" .
          BUNDLE_SHA256="$(sha256sum "${BUNDLE_PATH}" | awk '{print $1}')"
          printf '%s  deploy_bundle.tgz\n' "${BUNDLE_SHA256}" \
            > "${BUNDLE_PATH}.sha256"
          echo "bundle_sha256=${BUNDLE_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "bundle_path=${BUNDLE_PATH}" >> "${GITHUB_OUTPUT}"

          tar -tzf "${BUNDLE_PATH}" > /tmp/deploy_bundle.list
          grep -q '^\./release_manifest.json$' /tmp/deploy_bundle.list
          grep -q '^\./\.release-content.sha256$' /tmp/deploy_bundle.list
          grep -q '^\./docker-compose.prod.yml$' /tmp/deploy_bundle.list
          grep -q '^\./deploy/ecs-deploy.sh$' /tmp/deploy_bundle.list
          grep -q '^\./deploy/materialize_release_compose.py$' \
            /tmp/deploy_bundle.list
          grep -q '^\./deploy/validate_deploy_gate.py$' \
            /tmp/deploy_bundle.list
          grep -q '^\./deploy/release_integrity.py$' \
            /tmp/deploy_bundle.list
          grep -q '^\./data/$' /tmp/deploy_bundle.list
          grep -q '^\./config/data_pipeline.yaml$' /tmp/deploy_bundle.list
          grep -q '^\./config/market_alpha_development.json$' /tmp/deploy_bundle.list
          grep -q '^\./config/demo_incubation_policy.json$' /tmp/deploy_bundle.list
          grep -q '^\./ops/cron/closed-loop.cron.example$' /tmp/deploy_bundle.list
          grep -q '^\./tools/closed_loop_runner.sh$' /tmp/deploy_bundle.list
          grep -q '^\./tools/evaluate_demo_incubation.py$' /tmp/deploy_bundle.list
          grep -q '^\./tools/run_microstructure_alpha_development.py$' \
            /tmp/deploy_bundle.list
          grep -q '^\./tools/run_microstructure_alpha_lifecycle.py$' \
            /tmp/deploy_bundle.list
          (
            cd "${PAYLOAD_DIR}"
            sha256sum -c .release-content.sha256
          )

      - name: Upload Deployment Bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || 22 }}
          fingerprint: ${{ secrets.ECS_HOST_FINGERPRINT }}
          source: ".release-artifacts/${{ env.DEPLOY_RELEASE_ID }}/deploy_bundle.tgz,.release-artifacts/${{ env.DEPLOY_RELEASE_ID }}/deploy_bundle.tgz.sha256"
          target: "/opt/ai-trade/incoming/${{ env.DEPLOY_RELEASE_ID }}"
          strip_components: 2

      - name: Deploy to ECS
        uses: appleboy/ssh-action@v1.2.0
        env:
          AI_TRADE_IMAGE: ${{ env.RUNTIME_IMAGE_REF }}
          AI_TRADE_RESEARCH_IMAGE: ${{ env.RESEARCH_IMAGE_REF }}
          AI_TRADE_WEB_IMAGE: ${{ env.WEB_IMAGE_REF }}
          DEPLOY_RELEASE_ID: ${{ env.DEPLOY_RELEASE_ID }}
          DEPLOY_GIT_SHA: ${{ env.DEPLOY_GIT_SHA }}
          DEPLOY_WORKFLOW_RUN_ID: ${{ github.run_id }}
          DEPLOY_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          DEPLOY_BUNDLE_SHA256: ${{ steps.bundle.outputs.bundle_sha256 }}
          DEPLOY_RELEASE_ROOT: /opt/ai-trade
          DEPLOY_TARGET_RELEASE: /opt/ai-trade/releases/${{ env.DEPLOY_GIT_SHA }}
          DEPLOY_CURRENT_LINK: /opt/ai-trade/current
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_ENV_FILE: /opt/ai-trade/.env.runtime
          CLOSED_LOOP_ENFORCE: ${{ vars.CLOSED_LOOP_ENFORCE || 'true' }}
          CLOSED_LOOP_ACTION: ${{ vars.CLOSED_LOOP_ACTION || 'assess' }}
          CLOSED_LOOP_STAGE: ${{ vars.CLOSED_LOOP_STAGE || 'DEPLOY' }}
          CLOSED_LOOP_SINCE: ${{ vars.CLOSED_LOOP_SINCE || '30m' }}
          CLOSED_LOOP_MIN_RUNTIME_STATUS: ${{ vars.CLOSED_LOOP_MIN_RUNTIME_STATUS || '' }}
          CLOSED_LOOP_OUTPUT_ROOT: ${{ vars.CLOSED_LOOP_OUTPUT_ROOT || '/opt/ai-trade/data/reports/closed_loop' }}
          CLOSED_LOOP_STRICT_PASS: ${{ vars.CLOSED_LOOP_STRICT_PASS || 'true' }}
          CLOSED_LOOP_RUN_ID: deploy-${{ github.run_id }}-${{ github.run_attempt }}
          DEPLOY_SERVICES: ${{ vars.DEPLOY_SERVICES || 'ai-trade market-alpha-collector microstructure-demo-policy watchdog scheduler ai-trade-web' }}
          GATE_DEFER_SERVICES: ${{ vars.GATE_DEFER_SERVICES || 'watchdog scheduler ai-trade-web' }}
          DEPLOY_DISK_PREFLIGHT_ENABLED: ${{ vars.DEPLOY_DISK_PREFLIGHT_ENABLED || 'true' }}
          DEPLOY_GC_TRIGGER_FREE_BYTES: ${{ vars.DEPLOY_GC_TRIGGER_FREE_BYTES || '4294967296' }}
          DEPLOY_MIN_FREE_BYTES: ${{ vars.DEPLOY_MIN_FREE_BYTES || '1073741824' }}
          DEPLOY_POST_PULL_MIN_FREE_BYTES: ${{ vars.DEPLOY_POST_PULL_MIN_FREE_BYTES || '536870912' }}
          DEPLOY_DOCKER_GC_UNTIL: ${{ vars.DEPLOY_DOCKER_GC_UNTIL || '1h' }}
          DEPLOY_HOST_GC_ENABLED: ${{ vars.DEPLOY_HOST_GC_ENABLED || 'true' }}
          DEPLOY_RELEASE_KEEP_COUNT: ${{ vars.DEPLOY_RELEASE_KEEP_COUNT || '3' }}
          DEPLOY_RUNTIME_COMPOSE_KEEP_COUNT: ${{ vars.DEPLOY_RUNTIME_COMPOSE_KEEP_COUNT || '8' }}
          DEPLOY_REPORT_KEEP_RUN_DIRS: ${{ vars.DEPLOY_REPORT_KEEP_RUN_DIRS || '12' }}
          DEPLOY_REPORT_MAX_AGE_HOURS: ${{ vars.DEPLOY_REPORT_MAX_AGE_HOURS || '72' }}
          DEPLOY_REPORT_MAX_BYTES: ${{ vars.DEPLOY_REPORT_MAX_BYTES || '4294967296' }}
          DEPLOY_LOCK_WAIT_SECONDS: ${{ vars.DEPLOY_LOCK_WAIT_SECONDS || '1800' }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || 22 }}
          fingerprint: ${{ secrets.ECS_HOST_FINGERPRINT }}
          command_timeout: 45m
          envs: AI_TRADE_IMAGE,AI_TRADE_RESEARCH_IMAGE,AI_TRADE_WEB_IMAGE,DEPLOY_RELEASE_ID,DEPLOY_GIT_SHA,DEPLOY_WORKFLOW_RUN_ID,DEPLOY_WORKFLOW_RUN_ATTEMPT,DEPLOY_BUNDLE_SHA256,DEPLOY_RELEASE_ROOT,DEPLOY_TARGET_RELEASE,DEPLOY_CURRENT_LINK,GHCR_USER,GHCR_TOKEN,DEPLOY_ENV_FILE,CLOSED_LOOP_ENFORCE,CLOSED_LOOP_ACTION,CLOSED_LOOP_STAGE,CLOSED_LOOP_SINCE,CLOSED_LOOP_MIN_RUNTIME_STATUS,CLOSED_LOOP_OUTPUT_ROOT,CLOSED_LOOP_STRICT_PASS,CLOSED_LOOP_RUN_ID,DEPLOY_SERVICES,GATE_DEFER_SERVICES,DEPLOY_DISK_PREFLIGHT_ENABLED,DEPLOY_GC_TRIGGER_FREE_BYTES,DEPLOY_MIN_FREE_BYTES,DEPLOY_POST_PULL_MIN_FREE_BYTES,DEPLOY_DOCKER_GC_UNTIL,DEPLOY_HOST_GC_ENABLED,DEPLOY_RELEASE_KEEP_COUNT,DEPLOY_RUNTIME_COMPOSE_KEEP_COUNT,DEPLOY_REPORT_KEEP_RUN_DIRS,DEPLOY_REPORT_MAX_AGE_HOURS,DEPLOY_REPORT_MAX_BYTES,DEPLOY_LOCK_WAIT_SECONDS
          script: |
            set -euo pipefail
            export PYTHONDONTWRITEBYTECODE=1
            DEPLOY_ROOT="${DEPLOY_RELEASE_ROOT}"
            INCOMING_DIR="${DEPLOY_ROOT}/incoming/${DEPLOY_RELEASE_ID}"
            BUNDLE_PATH="${INCOMING_DIR}/deploy_bundle.tgz"
            BUNDLE_SHA_PATH="${INCOMING_DIR}/deploy_bundle.tgz.sha256"
            RELEASE_TMP_ROOT="${DEPLOY_ROOT}/.release-unpack"
            RELEASE_TMP="${RELEASE_TMP_ROOT}/${DEPLOY_RELEASE_ID}"
            RELEASE_DIR="${DEPLOY_TARGET_RELEASE}"
            seal_release_tree() {
              local release_path="$1"
              chmod -R a-w "${release_path}"
              local writable_path=""
              writable_path="$(find "${release_path}" -perm /222 -print -quit)"
              if [[ -n "${writable_path}" ]]; then
                echo "[deploy] immutable release remains writable: ${writable_path}"
                return 1
              fi
            }
            cleanup_release_unpack() {
              rm -rf "${RELEASE_TMP}" || true
              rm -rf "${INCOMING_DIR}" || true
            }
            trap cleanup_release_unpack EXIT
            mkdir -p "${DEPLOY_ROOT}/data/models"
            if ! command -v flock >/dev/null 2>&1; then
              echo "[deploy] flock is required for deployment transaction isolation"
              exit 1
            fi
            if [[ ! "${DEPLOY_LOCK_WAIT_SECONDS}" =~ ^[1-9][0-9]*$ ]]; then
              echo "[deploy] invalid DEPLOY_LOCK_WAIT_SECONDS=${DEPLOY_LOCK_WAIT_SECONDS}"
              exit 1
            fi
            exec 9> "${DEPLOY_ROOT}/data/models/closed_loop_runner.lock"
            echo "[deploy] waiting up to ${DEPLOY_LOCK_WAIT_SECONDS}s for Closed Loop/CD transaction lock"
            if ! flock -w "${DEPLOY_LOCK_WAIT_SECONDS}" 9; then
              echo "[deploy] deployment blocked: Closed Loop/CD transaction lock wait timed out"
              exit 1
            fi
            export CLOSED_LOOP_RUNNER_LOCK_HELD=true
            ACTIVATION_STATE="${DEPLOY_ROOT}/data/models/activation_transaction.json"
            if [[ -f "${ACTIVATION_STATE}" ]]; then
              python3 - "${ACTIVATION_STATE}" <<'PY'
            import json
            import sys
            from pathlib import Path

            path = Path(sys.argv[1])
            try:
                payload = json.loads(path.read_text(encoding="utf-8"))
            except (OSError, json.JSONDecodeError) as exc:
                raise SystemExit(f"activation transaction unreadable: {exc}")
            status = str(payload.get("status") or "invalid")
            if status not in {"committed", "rolled_back", "rolled_back_service_stopped"}:
                raise SystemExit(
                    "deployment blocked by nonterminal activation transaction: "
                    f"status={status}, run_id={payload.get('run_id')}"
                )
            PY
            fi

            if [[ "${DEPLOY_RELEASE_ID}" != "${DEPLOY_WORKFLOW_RUN_ID}-${DEPLOY_WORKFLOW_RUN_ATTEMPT}-${DEPLOY_GIT_SHA}" ]]; then
              echo "[deploy] release id does not bind workflow identity"
              exit 1
            fi
            if [[ ! "${DEPLOY_GIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "[deploy] invalid git sha: ${DEPLOY_GIT_SHA}"
              exit 1
            fi
            if [[ "${RELEASE_DIR}" != "${DEPLOY_ROOT}/releases/${DEPLOY_GIT_SHA}" ]]; then
              echo "[deploy] target release path is not bound to git sha: ${RELEASE_DIR}"
              exit 1
            fi
            for image_ref in \
              "${AI_TRADE_IMAGE}" \
              "${AI_TRADE_RESEARCH_IMAGE}" \
              "${AI_TRADE_WEB_IMAGE}"
            do
              if [[ ! "${image_ref}" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]; then
                echo "[deploy] image is not digest-pinned: ${image_ref}"
                exit 1
              fi
            done
            if [[ ! -s "${BUNDLE_PATH}" || ! -s "${BUNDLE_SHA_PATH}" ]]; then
              echo "[deploy] run-specific bundle or checksum missing: ${INCOMING_DIR}"
              exit 1
            fi
            ACTUAL_BUNDLE_SHA256="$(sha256sum "${BUNDLE_PATH}" | awk '{print $1}')"
            if [[ "${ACTUAL_BUNDLE_SHA256}" != "${DEPLOY_BUNDLE_SHA256}" ]]; then
              echo "[deploy] uploaded bundle sha mismatch: expected=${DEPLOY_BUNDLE_SHA256} actual=${ACTUAL_BUNDLE_SHA256}"
              exit 1
            fi
            (
              cd "${INCOMING_DIR}"
              sha256sum -c deploy_bundle.tgz.sha256
            )

            rm -rf "${RELEASE_TMP}"
            mkdir -p "${RELEASE_TMP_ROOT}" "${RELEASE_TMP}"
            python3 - "${BUNDLE_PATH}" "${RELEASE_TMP}" <<'PY'
            import pathlib
            import sys
            import tarfile

            bundle = pathlib.Path(sys.argv[1])
            destination = pathlib.Path(sys.argv[2])
            with tarfile.open(bundle, "r:gz") as archive:
                for member in archive.getmembers():
                    path = pathlib.PurePosixPath(member.name)
                    if path.is_absolute() or ".." in path.parts:
                        raise SystemExit(f"unsafe bundle path: {member.name}")
                    if member.issym() or member.islnk():
                        raise SystemExit(f"bundle links are forbidden: {member.name}")
                    if not (member.isfile() or member.isdir()):
                        raise SystemExit(f"unsupported bundle member: {member.name}")
                archive.extractall(destination)
            PY

            RELEASE_TMP_VALUE="${RELEASE_TMP}" \
            EXPECTED_RELEASE_ID="${DEPLOY_RELEASE_ID}" \
            EXPECTED_GIT_SHA="${DEPLOY_GIT_SHA}" \
            EXPECTED_RUNTIME_IMAGE="${AI_TRADE_IMAGE}" \
            EXPECTED_RESEARCH_IMAGE="${AI_TRADE_RESEARCH_IMAGE}" \
            EXPECTED_WEB_IMAGE="${AI_TRADE_WEB_IMAGE}" \
            python3 - <<'PY'
            import json
            import os
            from pathlib import Path

            root = Path(os.environ["RELEASE_TMP_VALUE"])
            manifest_path = root / "release_manifest.json"
            manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
            failures = []
            if manifest.get("schema_version") != "ai_trade_release_manifest_v1":
                failures.append("schema_version")
            if manifest.get("release_id") != os.environ["EXPECTED_RELEASE_ID"]:
                failures.append("release_id")
            if manifest.get("git_sha") != os.environ["EXPECTED_GIT_SHA"]:
                failures.append("git_sha")
            expected_images = {
                "runtime": os.environ["EXPECTED_RUNTIME_IMAGE"],
                "research": os.environ["EXPECTED_RESEARCH_IMAGE"],
                "web": os.environ["EXPECTED_WEB_IMAGE"],
            }
            if manifest.get("images") != expected_images:
                failures.append("images")
            if failures:
                raise SystemExit(
                    "release manifest validation failed: " + ",".join(failures)
                )
            PY
            python3 "${RELEASE_TMP}/deploy/release_integrity.py" \
              --release-dir "${RELEASE_TMP}"

            for required_file in \
              "${RELEASE_TMP}/release_manifest.json" \
              "${RELEASE_TMP}/.release-content.sha256" \
              "${RELEASE_TMP}/docker-compose.prod.yml" \
              "${RELEASE_TMP}/deploy/ecs-deploy.sh" \
              "${RELEASE_TMP}/deploy/materialize_release_compose.py" \
              "${RELEASE_TMP}/deploy/validate_deploy_gate.py" \
              "${RELEASE_TMP}/deploy/release_integrity.py" \
              "${RELEASE_TMP}/deploy/prune_release_storage.py" \
              "${RELEASE_TMP}/config/default.yaml" \
              "${RELEASE_TMP}/config/data_pipeline.yaml" \
              "${RELEASE_TMP}/config/market_alpha_development.json" \
              "${RELEASE_TMP}/config/demo_incubation_policy.json" \
              "${RELEASE_TMP}/tools/closed_loop_runner.sh" \
              "${RELEASE_TMP}/tools/evaluate_demo_incubation.py" \
              "${RELEASE_TMP}/tools/fetch_bybit_kline.py" \
              "${RELEASE_TMP}/tools/fetch_binance_archive.py" \
              "${RELEASE_TMP}/tools/fetch_market_alpha_history.py" \
              "${RELEASE_TMP}/tools/fetch_bybit_trade_history.py" \
              "${RELEASE_TMP}/tools/collect_bybit_microstructure.py" \
              "${RELEASE_TMP}/tools/run_microstructure_collector.py" \
              "${RELEASE_TMP}/tools/assess_microstructure_capture.py" \
              "${RELEASE_TMP}/tools/run_market_alpha_development.py" \
              "${RELEASE_TMP}/tools/run_microstructure_alpha_development.py" \
              "${RELEASE_TMP}/tools/run_microstructure_alpha_lifecycle.py" \
              "${RELEASE_TMP}/tools/economic_target_probe.py" \
              "${RELEASE_TMP}/tools/stream_market_ws.py" \
              "${RELEASE_TMP}/tools/gap_fill_klines.py" \
              "${RELEASE_TMP}/tools/build_feature_store.py" \
              "${RELEASE_TMP}/tools/backtest_walkforward.py" \
              "${RELEASE_TMP}/tools/run_data_pipeline.py" \
              "${RELEASE_TMP}/tools/integrator_train.py" \
              "${RELEASE_TMP}/tools/assess_run_log.py" \
              "${RELEASE_TMP}/tools/model_registry.py" \
              "${RELEASE_TMP}/tools/build_closed_loop_report.py" \
              "${RELEASE_TMP}/tools/build_periodic_summary.py" \
              "${RELEASE_TMP}/tools/recycle_artifacts.sh" \
              "${RELEASE_TMP}/tools/docker_gc.sh" \
              "${RELEASE_TMP}/ops/cron/closed-loop.cron.example" \
              "${RELEASE_TMP}/observability/loki/loki-config.yaml" \
              "${RELEASE_TMP}/observability/promtail/promtail-config.yml" \
              "${RELEASE_TMP}/observability/prometheus/prometheus.yml" \
              "${RELEASE_TMP}/observability/prometheus/rules/alerts.yml" \
              "${RELEASE_TMP}/observability/grafana/provisioning/datasources/loki.yaml" \
              "${RELEASE_TMP}/observability/grafana/provisioning/datasources/prometheus.yaml" \
              "${RELEASE_TMP}/observability/grafana/provisioning/dashboards/dashboards.yaml" \
              "${RELEASE_TMP}/observability/grafana/dashboards/ai-trade-runtime.json" \
              "${RELEASE_TMP}/observability/grafana/dashboards/ai-trade-prometheus-runtime.json"
            do
              if [[ ! -f "${required_file}" ]]; then
                echo "[deploy] missing required file in bundle: ${required_file}"
                exit 1
              fi
            done

            for executable_file in \
              "${RELEASE_TMP}/deploy/ecs-deploy.sh" \
              "${RELEASE_TMP}/tools/closed_loop_runner.sh" \
              "${RELEASE_TMP}/tools/recycle_artifacts.sh" \
              "${RELEASE_TMP}/tools/docker_gc.sh" \
              "${RELEASE_TMP}/ops/cron/install_closed_loop_cron.sh"
            do
              if [[ ! -x "${executable_file}" ]]; then
                echo "[deploy] required script is not executable: ${executable_file}"
                exit 1
              fi
            done

            mkdir -p "${DEPLOY_ROOT}/releases"
            if [[ -e "${RELEASE_DIR}" ]]; then
              EXISTING_RELEASE_VALUE="${RELEASE_DIR}" \
              CANDIDATE_RELEASE_VALUE="${RELEASE_TMP}" \
              python3 - <<'PY'
            import json
            import os
            from pathlib import Path

            existing = Path(os.environ["EXISTING_RELEASE_VALUE"])
            candidate = Path(os.environ["CANDIDATE_RELEASE_VALUE"])
            existing_manifest = json.loads(
                (existing / "release_manifest.json").read_text(encoding="utf-8")
            )
            candidate_manifest = json.loads(
                (candidate / "release_manifest.json").read_text(encoding="utf-8")
            )
            for field in ("schema_version", "git_sha", "images", "content_manifest"):
                if existing_manifest.get(field) != candidate_manifest.get(field):
                    raise SystemExit(
                        f"immutable release collision for {field}: {existing}"
                    )
            PY
              python3 "${RELEASE_TMP}/deploy/release_integrity.py" \
                --release-dir "${RELEASE_DIR}" \
                --repair-runtime-contamination \
                --quarantine-root "${DEPLOY_ROOT}/data/release-contamination"
              seal_release_tree "${RELEASE_DIR}"
              rm -rf "${RELEASE_TMP}"
            else
              mv "${RELEASE_TMP}" "${RELEASE_DIR}"
              seal_release_tree "${RELEASE_DIR}"
            fi

            echo "[deploy] closed-loop gate config: enforce=${CLOSED_LOOP_ENFORCE} action=${CLOSED_LOOP_ACTION} stage=${CLOSED_LOOP_STAGE} since=${CLOSED_LOOP_SINCE} strict=${CLOSED_LOOP_STRICT_PASS} min_runtime_status=${CLOSED_LOOP_MIN_RUNTIME_STATUS} run_id=${CLOSED_LOOP_RUN_ID}"
            echo "[deploy] deploy services: ${DEPLOY_SERVICES}, gate defer services: ${GATE_DEFER_SERVICES}"
            "${RELEASE_DIR}/deploy/ecs-deploy.sh" "${RELEASE_DIR}/docker-compose.prod.yml" "${DEPLOY_ENV_FILE}"
            rm -rf "${INCOMING_DIR}" ||
              echo "[deploy] warning: failed to clean incoming release ${INCOMING_DIR}"

      - name: Download Deploy Gate Reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          umask 077
          cat > .artifacts/ecs_key <<'EOF'
          ${{ secrets.ECS_SSH_KEY }}
          EOF
          sed -i 's/\r$//' .artifacts/ecs_key
          chmod 600 .artifacts/ecs_key
          if ! ssh-keygen -y -f .artifacts/ecs_key >/dev/null 2>&1; then
            echo "[deploy] invalid ECS_SSH_KEY format after normalization, skip artifact download"
            rm -f .artifacts/ecs_key
            cat > .artifacts/deploy_gate_download_status.json <<'EOF'
          {
            "status": "SKIPPED",
            "reason": "invalid_ssh_key_format"
          }
          EOF
            exit 0
          fi
          PORT="${{ secrets.ECS_PORT || 22 }}"
          HOST="${{ secrets.ECS_HOST }}"
          USER="${{ secrets.ECS_USER }}"
          EXPECTED_FINGERPRINT_SECRET="${{ secrets.ECS_HOST_FINGERPRINT }}"
          EXPECTED_FINGERPRINT_VAR="${{ vars.ECS_HOST_FINGERPRINT }}"
          EXPECTED_FINGERPRINT="${EXPECTED_FINGERPRINT_SECRET:-${EXPECTED_FINGERPRINT_VAR}}"
          if [[ -z "${HOST}" || -z "${USER}" ]]; then
            echo "[deploy] ECS_HOST/ECS_USER missing, skip artifact download"
            rm -f .artifacts/ecs_key
            cat > .artifacts/deploy_gate_download_status.json <<'EOF'
          {
            "status": "SKIPPED",
            "reason": "missing_host_or_user"
          }
          EOF
            exit 0
          fi
          KNOWN_HOSTS_FILE=".artifacts/known_hosts"
          if ! ssh-keyscan -p "${PORT}" -t ed25519,ecdsa,rsa "${HOST}" > "${KNOWN_HOSTS_FILE}" 2>/dev/null; then
            echo "[deploy] failed to fetch host key via ssh-keyscan, skip artifact download"
            rm -f .artifacts/ecs_key "${KNOWN_HOSTS_FILE}"
            cat > .artifacts/deploy_gate_download_status.json <<'EOF'
          {
            "status": "SKIPPED",
            "reason": "ssh_keyscan_failed"
          }
          EOF
            exit 0
          fi
          if [[ ! -s "${KNOWN_HOSTS_FILE}" ]]; then
            echo "[deploy] ssh-keyscan returned empty host keys, skip artifact download"
            rm -f .artifacts/ecs_key "${KNOWN_HOSTS_FILE}"
            cat > .artifacts/deploy_gate_download_status.json <<'EOF'
          {
            "status": "SKIPPED",
            "reason": "ssh_keyscan_empty"
          }
          EOF
            exit 0
          fi
          if [[ -n "${EXPECTED_FINGERPRINT}" ]]; then
            if ! ssh-keygen -lf "${KNOWN_HOSTS_FILE}" | awk '{print $2}' | grep -Fxq "${EXPECTED_FINGERPRINT}"; then
              echo "[deploy] host fingerprint mismatch, skip artifact download"
              rm -f .artifacts/ecs_key "${KNOWN_HOSTS_FILE}"
              cat > .artifacts/deploy_gate_download_status.json <<'EOF'
          {
            "status": "SKIPPED",
            "reason": "host_fingerprint_mismatch"
          }
          EOF
              exit 0
            fi
          fi

          downloaded=0
          missing=()
          invalid=()
          validate_json_file() {
            local path="$1"
            if [[ ! -s "${path}" ]]; then
              return 1
            fi
            if command -v jq >/dev/null 2>&1; then
              jq -e . "${path}" >/dev/null 2>&1
            else
              python3 -m json.tool "${path}" >/dev/null 2>&1
            fi
          }
          fetch_report() {
            local remote_path="$1"
            local local_path="$2"
            local label="$3"
            local kind="${4:-json}"
            local tmp_path="${local_path}.tmp"
            rm -f "${tmp_path}" "${local_path}"
            if scp -i .artifacts/ecs_key -P "${PORT}" \
              -o UserKnownHostsFile="${KNOWN_HOSTS_FILE}" \
              -o StrictHostKeyChecking=yes \
              "${USER}@${HOST}:${remote_path}" "${tmp_path}"; then
              if [[ "${kind}" == "json" ]]; then
                if ! validate_json_file "${tmp_path}"; then
                  echo "[deploy] invalid ${label}: downloaded but JSON is malformed/empty"
                  invalid+=("${label}")
                  rm -f "${tmp_path}" "${local_path}"
                  return
                fi
              fi
              mv -f "${tmp_path}" "${local_path}"
              echo "[deploy] downloaded ${label}: ${remote_path}"
              downloaded=$((downloaded + 1))
            else
              echo "[deploy] missing or inaccessible ${label}: ${remote_path}"
              missing+=("${label}")
              rm -f "${tmp_path}" "${local_path}"
            fi
          }

          EXPECTED_RUN_ID="deploy-${{ github.run_id }}-${{ github.run_attempt }}"
          REMOTE_OUTPUT_ROOT="${{ vars.CLOSED_LOOP_OUTPUT_ROOT || '/opt/ai-trade/data/reports/closed_loop' }}"
          if [[ "${REMOTE_OUTPUT_ROOT}" != /* ]]; then
            REMOTE_OUTPUT_ROOT="/opt/ai-trade/${REMOTE_OUTPUT_ROOT#./}"
          fi
          REMOTE_BASE="${REMOTE_OUTPUT_ROOT%/}/${EXPECTED_RUN_ID}"
          echo "[deploy] expected deploy gate artifact path: run_id=${EXPECTED_RUN_ID} remote_base=${REMOTE_BASE}"

          fetch_report "${REMOTE_BASE}/closed_loop_report.json" ".artifacts/latest_closed_loop_report.json" "closed_loop_report" "json"
          fetch_report "${REMOTE_BASE}/runtime_assess.json" ".artifacts/latest_runtime_assess.json" "runtime_assess" "json"
          fetch_report "${REMOTE_BASE}/run_meta.json" ".artifacts/latest_run_meta.json" "run_meta" "json"
          fetch_report "${REMOTE_BASE}/run_manifest.json" ".artifacts/run_manifest.json" "run_manifest" "json"
          fetch_report "${REMOTE_BASE}/runtime.log" ".artifacts/runtime.log" "runtime_log" "text"
          fetch_report "${REMOTE_BASE}/step_status.jsonl" ".artifacts/step_status.jsonl" "step_status" "text"
          fetch_report "${REMOTE_BASE}/trade_ledger_report.json" ".artifacts/trade_ledger_report.json" "trade_ledger_report" "json"
          fetch_report "${REMOTE_BASE}/closed_loop_mechanism_report.json" ".artifacts/closed_loop_mechanism_report.json" "closed_loop_mechanism_report" "json"

          if [[ -f ".artifacts/latest_closed_loop_report.json" || -f ".artifacts/latest_run_meta.json" || -f ".artifacts/run_manifest.json" ]]; then
            if ! python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          expected = "deploy-${{ github.run_id }}-${{ github.run_attempt }}"
          checks = []
          for label, path in (
              ("closed_loop_report", Path(".artifacts/latest_closed_loop_report.json")),
              ("run_meta", Path(".artifacts/latest_run_meta.json")),
              ("run_manifest", Path(".artifacts/run_manifest.json")),
          ):
              if path.is_file():
                  payload = json.loads(path.read_text())
                  checks.append((label, str(payload.get("run_id", "")).strip()))
          bad = [(label, run_id) for label, run_id in checks if run_id != expected]
          if bad:
              print(
                  "[deploy] run_id mismatch: expected="
                  + expected
                  + " actual="
                  + ",".join(f"{label}:{run_id}" for label, run_id in bad),
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
            then
              invalid+=("run_id_consistency")
            fi
          fi

          for essential in latest_closed_loop_report latest_run_meta run_manifest; do
            case "${essential}" in
              latest_closed_loop_report) essential_path=".artifacts/latest_closed_loop_report.json" ;;
              latest_run_meta) essential_path=".artifacts/latest_run_meta.json" ;;
              run_manifest) essential_path=".artifacts/run_manifest.json" ;;
            esac
            if [[ ! -f "${essential_path}" ]]; then
              invalid+=("missing_essential_${essential}")
            fi
          done

          {
            echo "{"
            echo "  \"status\": \"DONE\","
            echo "  \"expected_run_id\": \"${EXPECTED_RUN_ID}\","
            echo "  \"remote_base\": \"${REMOTE_BASE}\","
            echo "  \"downloaded_count\": ${downloaded},"
            echo "  \"invalid_count\": ${#invalid[@]},"
            echo "  \"missing\": ["
            for i in "${!missing[@]}"; do
              sep=","
              if [[ "${i}" -eq $((${#missing[@]} - 1)) ]]; then
                sep=""
              fi
              echo "    \"${missing[$i]}\"${sep}"
            done
            echo "  ],"
            echo "  \"invalid\": ["
            for i in "${!invalid[@]}"; do
              sep=","
              if [[ "${i}" -eq $((${#invalid[@]} - 1)) ]]; then
                sep=""
              fi
              echo "    \"${invalid[$i]}\"${sep}"
            done
            echo "  ]"
            echo "}"
          } > .artifacts/deploy_gate_download_status.json

          echo "[deploy] downloaded_count=${downloaded} missing_count=${#missing[@]} invalid_count=${#invalid[@]}"
          rm -f .artifacts/ecs_key "${KNOWN_HOSTS_FILE}"
          if [[ "${#invalid[@]}" -gt 0 ]]; then
            exit 1
          fi

      - name: Upload Deploy Gate Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-closed-loop-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/*.json
            .artifacts/*.jsonl
            .artifacts/runtime.log
          include-hidden-files: true
          if-no-files-found: warn
