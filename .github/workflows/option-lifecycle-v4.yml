name: Option Lifecycle V4 Gate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows:
      - CD
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: option-lifecycle-v4
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 50
    env:
      AUDIT_EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      AUDIT_RUN_ID: option-lifecycle-v4-${{ github.run_id }}-${{ github.run_attempt }}
      AUDIT_CAPTURE_ROOT: /opt/ai-trade/data/research/bybit_btc_option_lifecycle_v4
      AUDIT_OUTPUT_ROOT: /opt/ai-trade/data/reports/option_lifecycle_v4
      AUDIT_STARTUP_ATTEMPTS: ${{ github.event_name == 'workflow_run' && '40' || '1' }}
    steps:
      - name: Check deploy secrets
        run: |
          set -euo pipefail
          test -n "${{ secrets.ECS_HOST }}"
          test -n "${{ secrets.ECS_USER }}"
          test -n "${{ secrets.ECS_SSH_KEY }}"

      - name: Audit checksum-bound lifecycle on ECS
        uses: appleboy/ssh-action@v1.2.0
        env:
          AUDIT_EXPECTED_SHA: ${{ env.AUDIT_EXPECTED_SHA }}
          AUDIT_RUN_ID: ${{ env.AUDIT_RUN_ID }}
          AUDIT_CAPTURE_ROOT: ${{ env.AUDIT_CAPTURE_ROOT }}
          AUDIT_OUTPUT_ROOT: ${{ env.AUDIT_OUTPUT_ROOT }}
          AUDIT_STARTUP_ATTEMPTS: ${{ env.AUDIT_STARTUP_ATTEMPTS }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || 22 }}
          fingerprint: ${{ secrets.ECS_HOST_FINGERPRINT }}
          command_timeout: 45m
          envs: AUDIT_EXPECTED_SHA,AUDIT_RUN_ID,AUDIT_CAPTURE_ROOT,AUDIT_OUTPUT_ROOT,AUDIT_STARTUP_ATTEMPTS
          script: |
            set -euo pipefail
            export PYTHONDONTWRITEBYTECODE=1
            AUDIT_EXPECTED_SHA="${AUDIT_EXPECTED_SHA:-}"
            AUDIT_RUN_ID="${AUDIT_RUN_ID:-option-lifecycle-v4-preflight-unknown}"
            AUDIT_CAPTURE_ROOT="${AUDIT_CAPTURE_ROOT:-/opt/ai-trade/data/research/bybit_btc_option_lifecycle_v4}"
            AUDIT_OUTPUT_ROOT="${AUDIT_OUTPUT_ROOT:-/opt/ai-trade/data/reports/option_lifecycle_v4}"
            AUDIT_STARTUP_ATTEMPTS="${AUDIT_STARTUP_ATTEMPTS:-1}"
            OUTPUT_DIR="${AUDIT_OUTPUT_ROOT}/${AUDIT_RUN_ID}"
            mkdir -p "${OUTPUT_DIR}"
            REPORT_PATH="${OUTPUT_DIR}/report.json"
            PAYOFF_REPORT_PATH="${OUTPUT_DIR}/payoff.json"
            ECONOMICS_REPORT_PATH="${OUTPUT_DIR}/economics.json"
            INTEGRITY_SUMMARY_PATH="${OUTPUT_DIR}/release_integrity_summary.json"
            EXECUTED_SHA=""
            write_preflight_failure() {
              local reason_code="$1"
              PRECHECK_REASON_CODE="${reason_code}" \
              PRECHECK_EXECUTED_SHA="${EXECUTED_SHA}" \
              PRECHECK_INTEGRITY_SUMMARY_PATH="${INTEGRITY_SUMMARY_PATH}" \
              python3 - "${REPORT_PATH}" <<'PY'
            import json
            import os
            import pathlib
            import sys
            import tempfile

            path = pathlib.Path(sys.argv[1])
            integrity_path = pathlib.Path(
                os.environ["PRECHECK_INTEGRITY_SUMMARY_PATH"]
            )
            try:
                release_integrity = json.loads(
                    integrity_path.read_text(encoding="utf-8")
                )
            except (OSError, json.JSONDecodeError):
                release_integrity = {
                    "schema_version": "ai_trade_release_integrity_summary_v1",
                    "valid": False,
                    "summary_available": False,
                }
            report = {
                "schema_version": "option_lifecycle_audit_v4",
                "identities": {
                    "executed_release_sha": os.environ.get("PRECHECK_EXECUTED_SHA", ""),
                },
                "archive_integrity": {
                    "root_present": False,
                    "valid_segment_count": 0,
                    "invalid_segment_count": 1,
                    "checksum_bound_snapshot_count": 0,
                },
                "startup_gate": {
                    "status": "FAIL",
                    "reason_counts": {"PREFLIGHT_FAILURE": 1},
                },
                "release_integrity": release_integrity,
                "lifecycle_gate": {"paired_delivery_evidence_valid": False},
                "decision": "INVALID_OPTION_LIFECYCLE_ARCHIVE",
                "reason_code": os.environ["PRECHECK_REASON_CODE"],
                "economic_evidence": False,
                "promotion_authority": False,
                "demo_activation_authorized": False,
                "live_activation_authorized": False,
            }
            path.parent.mkdir(parents=True, exist_ok=True)
            descriptor, temporary_name = tempfile.mkstemp(prefix=f".{path.name}.", dir=path.parent)
            try:
                with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
                    json.dump(report, handle, indent=2, sort_keys=True)
                    handle.write("\n")
                pathlib.Path(temporary_name).replace(path)
            finally:
                pathlib.Path(temporary_name).unlink(missing_ok=True)
            PY
            }
            attach_integrity_summary() {
              REPORT_PATH_VALUE="${REPORT_PATH}" \
              INTEGRITY_SUMMARY_PATH_VALUE="${INTEGRITY_SUMMARY_PATH}" \
              python3 - <<'PY'
            import json
            import os
            import pathlib
            import tempfile

            report_path = pathlib.Path(os.environ["REPORT_PATH_VALUE"])
            integrity_path = pathlib.Path(
                os.environ["INTEGRITY_SUMMARY_PATH_VALUE"]
            )
            report = json.loads(report_path.read_text(encoding="utf-8"))
            report["release_integrity"] = json.loads(
                integrity_path.read_text(encoding="utf-8")
            )
            descriptor, temporary_name = tempfile.mkstemp(
                prefix=f".{report_path.name}.", dir=report_path.parent
            )
            try:
                with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
                    json.dump(report, handle, indent=2, sort_keys=True)
                    handle.write("\n")
                pathlib.Path(temporary_name).replace(report_path)
            finally:
                pathlib.Path(temporary_name).unlink(missing_ok=True)
            PY
            }
            fail_preflight() {
              local reason_code="$1"
              write_preflight_failure "${reason_code}"
              echo "option lifecycle preflight failed: ${reason_code}" >&2
              exit 1
            }
            if [[ ! "${AUDIT_STARTUP_ATTEMPTS}" =~ ^[1-9][0-9]*$ ]]; then
              fail_preflight "INVALID_STARTUP_ATTEMPTS"
            fi
            RELEASE_DIR="$(readlink -f /opt/ai-trade/current || true)"
            if [[ -z "${RELEASE_DIR}" ]]; then
              fail_preflight "DEPLOYED_RELEASE_LINK_MISSING"
            fi
            EXECUTED_SHA="$(basename "${RELEASE_DIR}")"
            if [[ ! "${EXECUTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              fail_preflight "DEPLOYED_RELEASE_IDENTITY_INVALID"
            fi
            if [[ -n "${AUDIT_EXPECTED_SHA}" && "${EXECUTED_SHA}" != "${AUDIT_EXPECTED_SHA}" ]]; then
              fail_preflight "DEPLOYED_RELEASE_MISMATCH"
            fi
            if ! python3 "${RELEASE_DIR}/deploy/release_integrity.py" \
              --release-dir "${RELEASE_DIR}" \
              --repair-runtime-contamination \
              --quarantine-root /opt/ai-trade/data/release-contamination \
              --summary-output "${INTEGRITY_SUMMARY_PATH}"; then
              fail_preflight "RELEASE_INTEGRITY_FAILURE"
            fi
            cd "${RELEASE_DIR}"
            startup_pass=false
            for attempt in $(seq 1 "${AUDIT_STARTUP_ATTEMPTS}"); do
              python3 tools/audit_option_lifecycle_v4.py \
                --root "${AUDIT_CAPTURE_ROOT}" \
                --policy config/option_lifecycle_capture_v4.json \
                --manifest config/option_lifecycle_capture_manifest_v4.json \
                --executed-release-sha "${EXECUTED_SHA}" \
                --output "${REPORT_PATH}"
              attach_integrity_summary
              STARTUP_STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["startup_gate"]["status"])' "${REPORT_PATH}")"
              DECISION="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["decision"])' "${REPORT_PATH}")"
              if [[ "${STARTUP_STATUS}" == "PASS" ]]; then
                startup_pass=true
                break
              fi
              if [[ "${STARTUP_STATUS}" == "FAIL" || "${DECISION}" == "INVALID_OPTION_LIFECYCLE_ARCHIVE" ]]; then
                exit 2
              fi
              if (( attempt < AUDIT_STARTUP_ATTEMPTS )); then
                sleep 60
              fi
            done
            if [[ "${startup_pass}" != "true" ]]; then
              exit 3
            fi
            python3 tools/audit_option_lifecycle_payoff_v4.py \
              --root "${AUDIT_CAPTURE_ROOT}" \
              --capture-policy config/option_lifecycle_capture_v4.json \
              --capture-manifest config/option_lifecycle_capture_manifest_v4.json \
              --payoff-policy config/option_lifecycle_payoff_v2.json \
              --payoff-manifest config/option_lifecycle_payoff_manifest_v2.json \
              --executed-release-sha "${EXECUTED_SHA}" \
              --output "${PAYOFF_REPORT_PATH}"
            python3 tools/audit_option_lifecycle_economics_v1.py \
              --root "${AUDIT_CAPTURE_ROOT}" \
              --capture-policy config/option_lifecycle_capture_v4.json \
              --capture-manifest config/option_lifecycle_capture_manifest_v4.json \
              --payoff-policy config/option_lifecycle_payoff_v2.json \
              --payoff-manifest config/option_lifecycle_payoff_manifest_v2.json \
              --economic-policy config/option_lifecycle_economic_v1.json \
              --economic-manifest config/option_lifecycle_economic_manifest_v1.json \
              --executed-release-sha "${EXECUTED_SHA}" \
              --output "${ECONOMICS_REPORT_PATH}"

      - name: Download aggregate audit report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          umask 077
          cat > .artifacts/ecs_key <<'EOF'
          ${{ secrets.ECS_SSH_KEY }}
          EOF
          sed -i 's/\r$//' .artifacts/ecs_key
          chmod 600 .artifacts/ecs_key
          PORT="${{ secrets.ECS_PORT || 22 }}"
          HOST="${{ secrets.ECS_HOST }}"
          USER="${{ secrets.ECS_USER }}"
          KNOWN_HOSTS_FILE=.artifacts/known_hosts
          if [[ -z "${HOST}" || -z "${USER}" ]] || \
             ! ssh-keygen -y -f .artifacts/ecs_key >/dev/null 2>&1 || \
             ! ssh-keyscan -p "${PORT}" -t ed25519,ecdsa,rsa "${HOST}" > "${KNOWN_HOSTS_FILE}" 2>/dev/null; then
            rm -f .artifacts/ecs_key "${KNOWN_HOSTS_FILE}"
            exit 0
          fi
          report_downloaded=false
          for attempt in 1 2 3; do
            if scp -i .artifacts/ecs_key -P "${PORT}" \
              -o UserKnownHostsFile="${KNOWN_HOSTS_FILE}" -o StrictHostKeyChecking=yes \
              "${USER}@${HOST}:${AUDIT_OUTPUT_ROOT}/${AUDIT_RUN_ID}/report.json" .artifacts/report.json; then
              report_downloaded=true
              break
            fi
            sleep 10
          done
          payoff_downloaded=false
          for attempt in 1 2 3; do
            if scp -i .artifacts/ecs_key -P "${PORT}" \
              -o UserKnownHostsFile="${KNOWN_HOSTS_FILE}" -o StrictHostKeyChecking=yes \
              "${USER}@${HOST}:${AUDIT_OUTPUT_ROOT}/${AUDIT_RUN_ID}/payoff.json" .artifacts/payoff.json; then
              payoff_downloaded=true
              break
            fi
            sleep 10
          done
          economics_downloaded=false
          for attempt in 1 2 3; do
            if scp -i .artifacts/ecs_key -P "${PORT}" \
              -o UserKnownHostsFile="${KNOWN_HOSTS_FILE}" -o StrictHostKeyChecking=yes \
              "${USER}@${HOST}:${AUDIT_OUTPUT_ROOT}/${AUDIT_RUN_ID}/economics.json" .artifacts/economics.json; then
              economics_downloaded=true
              break
            fi
            sleep 10
          done
          rm -f .artifacts/ecs_key "${KNOWN_HOSTS_FILE}"
          echo "report_downloaded=${report_downloaded} payoff_downloaded=${payoff_downloaded} economics_downloaded=${economics_downloaded}"
          [[ "${report_downloaded}" == "true" ]]

      - name: Summarize aggregate audit diagnostics
        if: always()
        id: diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def token(value, fallback):
              rendered = str(value or fallback).upper()
              return rendered if re.fullmatch(r"[A-Z0-9_]+", rendered) else fallback

          report_path = Path(".artifacts/report.json")
          payoff_path = Path(".artifacts/payoff.json")
          economics_path = Path(".artifacts/economics.json")
          suffix = "NO_REPORT"
          if report_path.is_file():
              try:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
                  if report.get("schema_version") != "option_lifecycle_audit_v4":
                      suffix = "LIFECYCLE_SCHEMA_MISMATCH"
                  else:
                      integrity = report.get("archive_integrity", {})
                      gate = report.get("startup_gate", {})
                      lifecycle = report.get("lifecycle_gate", {})
                      payoff_decision = "NO_PAYOFF"
                      economic_decision = "NO_ECONOMICS"
                      economic_progress = "e0_6"
                      if payoff_path.is_file():
                          try:
                              payoff = json.loads(
                                  payoff_path.read_text(encoding="utf-8")
                              )
                              if payoff.get("schema_version") == "option_lifecycle_payoff_audit_v2":
                                  payoff_decision = token(
                                      payoff.get("decision"),
                                      "PAYOFF_DECISION_UNKNOWN",
                                  )
                              else:
                                  payoff_decision = "PAYOFF_SCHEMA_MISMATCH"
                          except (OSError, json.JSONDecodeError):
                              payoff_decision = "PAYOFF_UNREADABLE"
                      if economics_path.is_file():
                          try:
                              economics = json.loads(
                                  economics_path.read_text(encoding="utf-8")
                              )
                              if economics.get("schema_version") == "option_lifecycle_economic_audit_v1":
                                  economic_decision = token(
                                      economics.get("decision"),
                                      "ECONOMIC_DECISION_UNKNOWN",
                                  )
                                  progress = economics.get("progress", {})
                                  economic_progress = (
                                      f"e{int(progress.get('complete_lifecycle_count') or 0)}_"
                                      f"{int(progress.get('minimum_complete_lifecycles') or 6)}"
                                  )
                              else:
                                  economic_decision = "ECONOMIC_SCHEMA_MISMATCH"
                          except (OSError, json.JSONDecodeError, TypeError, ValueError):
                              economic_decision = "ECONOMIC_UNREADABLE"
                      suffix = "--".join((
                          token(report.get("decision"), "DECISION_UNKNOWN"),
                          token(gate.get("status"), "STATUS_UNKNOWN"),
                          f"s{int(integrity.get('valid_segment_count') or 0)}_{int(integrity.get('invalid_segment_count') or 0)}",
                          f"n{int(integrity.get('checksum_bound_snapshot_count') or 0)}",
                          f"x{int(gate.get('distinct_segment_count') or 0)}",
                          f"q{int(gate.get('qualified_snapshot_count') or 0)}",
                          f"d{int(bool(lifecycle.get('paired_delivery_evidence_valid')))}",
                          token(report.get("reason_code"), "REASON_UNKNOWN"),
                          payoff_decision,
                          economic_progress,
                          economic_decision,
                      ))[:190]
              except (OSError, json.JSONDecodeError, TypeError, ValueError):
                  suffix = "LIFECYCLE_REPORT_UNREADABLE"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"artifact_suffix={suffix}\n")
          print(suffix)
          PY

      - name: Validate aggregate audit report
        if: always()
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path(".artifacts/report.json")
          if not path.is_file():
              raise SystemExit("aggregate v4 lifecycle report was not downloaded")
          report = json.loads(path.read_text(encoding="utf-8"))
          if report.get("schema_version") != "option_lifecycle_audit_v4":
              raise SystemExit("aggregate v4 lifecycle report schema mismatch")
          executed = report.get("identities", {}).get("executed_release_sha", "")
          if not re.fullmatch(r"[0-9a-f]{40}", executed):
              raise SystemExit("aggregate v4 lifecycle report release mismatch")
          expected = os.environ.get("AUDIT_EXPECTED_SHA", "")
          if expected and executed != expected:
              raise SystemExit("aggregate v4 lifecycle report expected release mismatch")
          for field in ("economic_evidence", "promotion_authority", "demo_activation_authorized", "live_activation_authorized"):
              if report.get(field) is not False:
                  raise SystemExit(f"aggregate report grants forbidden authority: {field}")
          rendered = json.dumps(report, sort_keys=True)
          if any(value in rendered for value in ("tracked_options", "discovery_options", ".jsonl.xz", "tracking_state.json")):
              raise SystemExit("aggregate v4 lifecycle report leaked raw evidence")
          accepted = {
              "WAIT_FOR_FIRST_COMPLETE_LIFECYCLE",
              "PASS_FIRST_COMPLETE_LIFECYCLE_FOR_PAYOFF_RECONSTRUCTION_ONLY",
              "INSUFFICIENT_FIRST_COMPLETE_LIFECYCLE",
          }
          if report.get("decision") not in accepted or report.get("startup_gate", {}).get("status") != "PASS":
              raise SystemExit(f"v4 lifecycle startup gate failed: {report.get('decision')}")
          payoff_path = Path(".artifacts/payoff.json")
          if not payoff_path.is_file():
              raise SystemExit("aggregate v4 lifecycle payoff report was not downloaded")
          payoff = json.loads(payoff_path.read_text(encoding="utf-8"))
          if payoff.get("schema_version") != "option_lifecycle_payoff_audit_v2":
              raise SystemExit("aggregate v4 lifecycle payoff report schema mismatch")
          if payoff.get("identities", {}).get("executed_release_sha") != executed:
              raise SystemExit("aggregate v4 lifecycle payoff release mismatch")
          for field in ("profitability_evidence", "sharpe_evidence", "drawdown_evidence",
                        "promotion_authority", "demo_activation_authorized", "live_activation_authorized"):
              if payoff.get(field) is not False:
                  raise SystemExit(f"aggregate payoff report grants forbidden evidence or authority: {field}")
          payoff_rendered = json.dumps(payoff, sort_keys=True)
          if any(value in payoff_rendered for value in ("hedge_ledger", "tracked_options", "discovery_options", ".jsonl.xz", "tracking_state.json")):
              raise SystemExit("aggregate v4 payoff report leaked raw evidence")
          payoff_accepted = {
              "WAIT_FOR_FIRST_COMPLETE_LIFECYCLE_PAYOFF",
              "RECONCILED_FIRST_LIFECYCLE_PAYOFF_FOR_DIAGNOSTIC_ONLY",
              "INSUFFICIENT_FIRST_LIFECYCLE_PAYOFF",
          }
          if payoff.get("decision") not in payoff_accepted:
              raise SystemExit(f"v4 lifecycle payoff gate failed: {payoff.get('decision')}")
          economics_path = Path(".artifacts/economics.json")
          if not economics_path.is_file():
              raise SystemExit("aggregate v4 lifecycle economics report was not downloaded")
          economics = json.loads(economics_path.read_text(encoding="utf-8"))
          if economics.get("schema_version") != "option_lifecycle_economic_audit_v1":
              raise SystemExit("aggregate v4 lifecycle economics report schema mismatch")
          if economics.get("identities", {}).get("executed_release_sha") != executed:
              raise SystemExit("aggregate v4 lifecycle economics release mismatch")
          for field in ("profitability_claim_allowed", "sharpe_claim_allowed", "drawdown_claim_allowed",
                        "promotion_authority", "demo_activation_authorized", "live_activation_authorized"):
              if economics.get(field) is not False:
                  raise SystemExit(f"aggregate economics report grants forbidden claim or authority: {field}")
          economics_rendered = json.dumps(economics, sort_keys=True)
          if any(value in economics_rendered for value in ("hedge_ledger", "tracked_options", "discovery_options", ".jsonl.xz", "tracking_state.json")):
              raise SystemExit("aggregate v4 economics report leaked raw evidence")
          economics_accepted = {
              "WAIT_FOR_MULTI_LIFECYCLE_ECONOMIC_EVIDENCE",
              "CONTINUE_MULTI_LIFECYCLE_ECONOMIC_EVIDENCE",
              "PASS_MULTI_LIFECYCLE_ECONOMICS_FOR_DEMO_REVIEW_ONLY",
              "STOP_MULTI_LIFECYCLE_ECONOMICS_NO_STRESS_EDGE",
          }
          if economics.get("decision") not in economics_accepted:
              raise SystemExit(f"v4 lifecycle economics gate failed: {economics.get('decision')}")
          gate = report["startup_gate"]
          integrity = report["archive_integrity"]
          progress = economics["progress"]
          suffix = "--".join((
              report["decision"], f"s{integrity['valid_segment_count']}_{integrity['invalid_segment_count']}",
              f"n{integrity['checksum_bound_snapshot_count']}", f"x{gate['distinct_segment_count']}",
              f"q{gate['qualified_snapshot_count']}", f"d{int(report['lifecycle_gate']['paired_delivery_evidence_valid'])}",
              payoff["decision"],
              f"e{progress['complete_lifecycle_count']}_{progress['minimum_complete_lifecycles']}",
              economics["decision"],
          ))[:190]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"artifact_suffix={suffix}\n")
          print(json.dumps({"startup_gate": gate, "lifecycle_gate": report["lifecycle_gate"],
                            "decision": report["decision"], "payoff": payoff,
                            "economics": economics}, indent=2, sort_keys=True))
          PY

      - name: Upload aggregate lifecycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: option-lifecycle-v4-${{ steps.diagnostics.outputs.artifact_suffix }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/report.json
            .artifacts/payoff.json
            .artifacts/economics.json
          if-no-files-found: warn
