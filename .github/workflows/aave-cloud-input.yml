name: Aave isolated encrypted input once
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        type: string
        required: true
      seed_sha256:
        type: string
        required: true
      recipient_certificate_base64:
        description: Public certificate only; private key remains on the local Mac
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ai-trade-aave-cloud-input-20261013
  cancel-in-progress: false
jobs:
  input:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bind the single approved execution
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_RUN_ATTEMPT" = '1'
      - name: Native transport and encrypted-delivery regressions without credentials
        run: >-
          python3 tools/validation_gate.py --state "${RUNNER_TEMP}/aave-cloud-gate.json"
          run --label cloud-native-synthetic --timeout 120 --
          python3 -m unittest discover -s tools -p test_aave_cloud_input.py
      - name: Fixed native controls and bounded complete acquisition
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_SEED_SHA: ${{ inputs.seed_sha256 }}
          RECIPIENT_CERTIFICATE_BASE64: ${{ inputs.recipient_certificate_base64 }}
          ALCHEMY_RPC_URL: ${{ secrets.AAVE_CLOUD_20261013_RPC }}
          SEED_00: ${{ secrets.AAVE_CLOUD_20261013_SEED_00 }}
          SEED_01: ${{ secrets.AAVE_CLOUD_20261013_SEED_01 }}
          SEED_02: ${{ secrets.AAVE_CLOUD_20261013_SEED_02 }}
          SEED_03: ${{ secrets.AAVE_CLOUD_20261013_SEED_03 }}
          SEED_04: ${{ secrets.AAVE_CLOUD_20261013_SEED_04 }}
          SEED_05: ${{ secrets.AAVE_CLOUD_20261013_SEED_05 }}
          SEED_06: ${{ secrets.AAVE_CLOUD_20261013_SEED_06 }}
          SEED_07: ${{ secrets.AAVE_CLOUD_20261013_SEED_07 }}
          SEED_08: ${{ secrets.AAVE_CLOUD_20261013_SEED_08 }}
          SEED_09: ${{ secrets.AAVE_CLOUD_20261013_SEED_09 }}
          CLOUD_OUTPUT: ${{ runner.temp }}/aave-cloud-output
        run: >-
          python3 tools/validation_gate.py --state "${RUNNER_TEMP}/aave-cloud-gate.json"
          run --label cloud-native-once --timeout 3300 --
          python3 tools/aave_cloud_input.py collect
      - name: Retain only encrypted input and sanitized binding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aave-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aave-cloud-output/native.cms
            ${{ runner.temp }}/aave-cloud-output/receipt.json
          retention-days: 7
          if-no-files-found: error
