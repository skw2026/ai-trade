name: Frozen Two Sided Quote Screen Once
on:
  workflow_dispatch:
    inputs:
      expected_controller_sha:
        type: string
        required: true
      expected_contract_sha256:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ai-trade-forward-evidence
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Frozen model and transport synthetic checks
        run: python3 -B tools/test_two_sided_quote_screen.py
      - name: Native Linux read-only container checks
        run: |
          docker pull --platform linux/amd64 ghcr.io/skw2026/ai-trade-research@sha256:96e70a394c8a74264e5ea30a4bdbcb2b08aed313e587296b757299d98de93eba
          python3 -B tools/test_two_sided_screen_container.py
      - name: Same originals all-segment replay and unique screen
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          EXPECTED_CONTRACT_SHA256: ${{ inputs.expected_contract_sha256 }}
          ECS_TRANSPORT_HOST: ${{ secrets.ECS_HOST }}
          ECS_TRANSPORT_USER: ${{ secrets.ECS_USER }}
          ECS_TRANSPORT_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_TRANSPORT_PORT: ${{ secrets.ECS_PORT || 22 }}
          ECS_TRANSPORT_FINGERPRINT: ${{ secrets.ECS_HOST_FINGERPRINT }}
        run: python3 -B tools/two_sided_screen_remote.py
      - name: Retain sanitized screen receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-sided-screen-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/two-sided-screen/run-binding.json
            .artifacts/two-sided-screen/remote-receipt.json
          retention-days: 7
          if-no-files-found: error
