name: ECS Release Audit

on:
  push:
    tags:
      - "infra/ecs-release-audit/**"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit deployed release
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT || '22' }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_HOST_FINGERPRINT_SECRET: ${{ secrets.ECS_HOST_FINGERPRINT }}
          ECS_HOST_FINGERPRINT_VAR: ${{ vars.ECS_HOST_FINGERPRINT }}
          EXPECTED_RELEASE_SHA: cd0cd90475c70d52d12f98ead3f4f76f9fdb3f69
          EXPECTED_RESEARCH_RUN_ID: gha-33732734520-1
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ECS_HOST}"
          test -n "${ECS_USER}"
          test -n "${ECS_SSH_KEY}"
          umask 077
          printf '%s\n' "${ECS_SSH_KEY}" > ecs_key
          sed -i 's/\r$//' ecs_key
          ssh-keygen -y -f ecs_key >/dev/null
          ssh-keyscan -T 10 -p "${ECS_PORT}" -t ed25519,ecdsa,rsa \
            "${ECS_HOST}" > known_hosts 2>/dev/null
          test -s known_hosts
          expected_fingerprint="${ECS_HOST_FINGERPRINT_SECRET:-${ECS_HOST_FINGERPRINT_VAR:-}}"
          if [[ -n "${expected_fingerprint}" ]]; then
            ssh-keygen -lf known_hosts | awk '{print $2}' | \
              grep -Fxq "${expected_fingerprint}"
          else
            echo "::warning title=ECS release audit::check=HOST_FINGERPRINT; result=EXPECTED_MISSING"
          fi

          set +e
          ssh -i ecs_key \
            -p "${ECS_PORT}" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -o UserKnownHostsFile=known_hosts \
            -o StrictHostKeyChecking=yes \
            "${ECS_USER}@${ECS_HOST}" \
            "bash -s -- '${EXPECTED_RELEASE_SHA}' '${EXPECTED_RESEARCH_RUN_ID}'" > release_checks <<'REMOTE'
          set +e
          expected_sha="$1"
          expected_research_run_id="$2"
          deploy_root="/opt/ai-trade"
          release_dir="$(readlink -f "${deploy_root}/current" 2>/dev/null || true)"
          if [[ "${release_dir}" == "${deploy_root}/releases/${expected_sha}" ]]; then
            echo "RELEASE=PASS"
          else
            echo "RELEASE=FAIL"
          fi

          runtime_revision="$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' ai-trade 2>/dev/null || true)"
          if [[ "${runtime_revision}" == "${expected_sha}" ]]; then
            echo "RUNTIME_REVISION=PASS"
          else
            echo "RUNTIME_REVISION=FAIL"
          fi

          collector_state="$(docker inspect -f '{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' ai-trade-option-vrp-collector 2>/dev/null || true)"
          if [[ "${collector_state}" == "running/healthy" ]]; then
            echo "OPTION_COLLECTOR=PASS"
          else
            echo "OPTION_COLLECTOR=FAIL"
          fi

          if [[ -f "${release_dir}/config/option_variance_risk_premium_sequential_payoff_v2.json" &&
                -f "${release_dir}/config/option_variance_risk_premium_sequential_payoff_manifest_v2.json" ]]; then
            echo "OPTION_V2_CONTRACT=PASS"
          else
            echo "OPTION_V2_CONTRACT=FAIL"
          fi

          runtime_log="$(docker logs ai-trade 2>&1 || true)"
          if grep -Fq 'WAL_NONTRADING_CHECKPOINT_RECOVERY: skipped_records=2, execution_records_skipped=0' <<<"${runtime_log}"; then
            echo "WAL_RECOVERY=PASS"
          else
            echo "WAL_RECOVERY=FAIL"
          fi
          if grep -Fq 'WAL 加载失败' <<<"${runtime_log}"; then
            echo "WAL_LOAD_FAILURE=PRESENT"
          else
            echo "WAL_LOAD_FAILURE=ABSENT"
          fi

          temporary_log="$(mktemp /tmp/ai-trade-exchange-check.XXXXXX)"
          timeout 90 docker exec ai-trade \
            /app/trade_bot \
            --config=config/bybit.demo.s5.yaml \
            --exchange=bybit \
            --check-exchange >"${temporary_log}" 2>&1
          exchange_status=$?
          if (( exchange_status == 0 )) &&
             grep -Fq 'EXCHANGE_CHECK_PASSED' "${temporary_log}"; then
            echo "EXCHANGE_CHECK=PASS"
          else
            echo "EXCHANGE_CHECK=FAIL"
          fi
          rm -f "${temporary_log}"

          option_report="${deploy_root}/data/reports/closed_loop/${expected_research_run_id}/option_variance_risk_premium_sequential_payoff.json"
          summary_report="${deploy_root}/data/reports/closed_loop/${expected_research_run_id}/closed_loop_report.json"
          python3 - "${option_report}" "${summary_report}" <<'PY'
          import json
          import math
          import pathlib
          import sys

          checks = {
              "OPTION_V2_REPORT_COMPLETE": False,
              "OPTION_V2_POLICY_IDENTITY": False,
              "OPTION_V2_POSTSTART_CLOCK": False,
              "OPTION_V2_ELIGIBLE_VALID": False,
              "OPTION_V2_SETTLED_EPISODE": False,
              "OPTION_V2_PAYOFF_IDENTITY": False,
              "OPTION_V2_DECISION_WAIT": False,
              "OPTION_V2_NONPROMOTIONAL": False,
              "OPTION_V2_SUMMARY_ROUTED": False,
          }
          try:
              report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
              manifest = report.get("observation_manifest", {})
              replay = report.get("capture_replay", {})
              primary_summary = report.get("primary_summary", {})
              policy = report.get("policy", {})
              checks["OPTION_V2_REPORT_COMPLETE"] = (
                  report.get("schema_version")
                  == "option_variance_risk_premium_sequential_payoff_audit_v1"
                  and report.get("status") == "COMPLETE"
              )
              checks["OPTION_V2_POLICY_IDENTITY"] = (
                  policy.get("identity_verified") is True
                  and policy.get("canonical_sha256")
                  == "6f23634e0f5e6a708d76387f6552e9089a0ef830bbb82790300d97ececd5530b"
                  and manifest.get("identity_verified") is True
                  and manifest.get("canonical_sha256")
                  == "13b62a179c2e3131762918063bfecfb1a2f9c853693144d0dc2a8428b2f58aeb"
                  and manifest.get("experiment_id")
                  == "btc_bybit_usdt_option_vrp_1d_sequential_payoff_v2"
              )
              evaluated_now = int(report.get("evaluated_now_epoch_ms") or 0)
              checks["OPTION_V2_POSTSTART_CLOCK"] = (
                  manifest.get("observation_start_epoch_ms") == 1788242400000
                  and manifest.get("observation_start_utc") == "2026-09-01T06:00:00Z"
                  and evaluated_now >= 1788242400000
              )
              eligible = int(replay.get("eligible_snapshot_count") or 0)
              successful_polls = int(replay.get("successful_poll_count") or 0)
              first_eligible = int(replay.get("first_eligible_epoch_ms") or 0)
              last_eligible = int(replay.get("last_eligible_epoch_ms") or 0)
              checks["OPTION_V2_ELIGIBLE_VALID"] = (
                  replay.get("root_present") is True
                  and int(replay.get("valid_segment_count") or 0) > 0
                  and replay.get("invalid_segment_count") == 0
                  and eligible > 0
                  and successful_polls == eligible
                  and float(replay.get("checksum_bound_seconds") or 0.0) > 0.0
                  and first_eligible >= 1788242400000
                  and first_eligible <= last_eligible <= evaluated_now
                  and report.get("episode_invalid_count") == 0
              )
              primary_episodes = report.get("episodes", {}).get(
                  "short_atm_straddle_1d", []
              )
              pending_entries = sum(
                  row.get("state") == "pending_delivery"
                  and int(row.get("entry_timestamp_epoch_ms") or 0)
                  >= 1788242400000
                  for row in primary_episodes
                  if isinstance(row, dict)
              )
              completed = [
                  row for row in primary_episodes
                  if isinstance(row, dict) and row.get("state") == "complete"
              ]
              completed_count = int(
                  primary_summary.get("completed_expiry_count") or 0
              )
              checks["OPTION_V2_SETTLED_EPISODE"] = (
                  completed_count >= 1
                  and len(completed) == completed_count
                  and all(
                      int(row.get("entry_timestamp_epoch_ms") or 0)
                      >= 1788242400000
                      and int(row.get("delivery_time_epoch_ms") or 0)
                      <= evaluated_now
                      and float(row.get("delivery_price") or 0.0) > 0.0
                      and float(row.get("capital_normalizer_usdt") or 0.0) > 0.0
                      and len(row.get("symbols") or []) == 2
                      and len(row.get("hedge_ledger") or []) > 0
                      for row in completed
                  )
              )
              finite_fields = (
                  "gross_pnl_usdt", "option_spread_cost_usdt",
                  "option_fee_usdt", "delivery_fee_usdt",
                  "hedge_spread_cost_usdt", "hedge_fee_usdt",
                  "stress_increment_usdt", "base_net_pnl_usdt",
                  "stress_net_pnl_usdt", "gross_bps", "base_net_bps",
                  "stress_net_bps",
              )
              checks["OPTION_V2_PAYOFF_IDENTITY"] = bool(completed) and all(
                  all(
                      isinstance(row.get(field), (int, float))
                      and not isinstance(row.get(field), bool)
                      and math.isfinite(float(row[field]))
                      for field in finite_fields
                  )
                  and abs(float(row.get("identity_residual_usdt") or 0.0)) <= 1e-9
                  and abs(float(row.get("residual_hedge_quantity_btc") or 0.0)) <= 1e-12
                  and float(row["stress_net_pnl_usdt"])
                      <= float(row["base_net_pnl_usdt"]) + 1e-12
                  and float(row["base_net_pnl_usdt"])
                      <= float(row["gross_pnl_usdt"]) + 1e-12
                  and all(
                      float(row[field]) >= 0.0
                      for field in (
                          "option_spread_cost_usdt", "option_fee_usdt",
                          "delivery_fee_usdt", "hedge_spread_cost_usdt",
                          "hedge_fee_usdt", "stress_increment_usdt",
                      )
                  )
                  for row in completed
              )
              checks["OPTION_V2_DECISION_WAIT"] = (
                  report.get("decision")
                  == "WAIT_FOR_OPTION_VRP_SEQUENTIAL_EVIDENCE"
                  and report.get("reason_code") == "INCONCLUSIVE"
                  and report.get("review_day") is None
                  and report.get("next_action")
                  == "collect_checksum_bound_v2_evidence"
              )
              checks["OPTION_V2_NONPROMOTIONAL"] = all(
                  report.get(field) is False
                  for field in (
                      "promotion_evidence",
                      "promotion_eligible",
                      "promotion_authority",
                      "demo_activation_authorized",
                      "live_activation_authorized",
                  )
              )
              summary_report = json.loads(
                  pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
              )
              closed_loop_section = summary_report.get("sections", {}).get(
                  "option_variance_risk_premium_sequential_payoff", {}
              )
              metrics = closed_loop_section.get("metrics", {})
              checks["OPTION_V2_SUMMARY_ROUTED"] = (
                  closed_loop_section.get("status") == "pass"
                  and closed_loop_section.get("readiness_status") == "PASS_WITH_ACTIONS"
                  and closed_loop_section.get("fail_reasons") == []
                  and closed_loop_section.get("research_decision")
                  == "WAIT_FOR_OPTION_VRP_SEQUENTIAL_EVIDENCE"
                  and closed_loop_section.get("reason_code") == "INCONCLUSIVE"
                  and closed_loop_section.get("review_day") is None
                  and int(metrics.get("eligible_snapshot_count") or 0) == eligible
                  and eligible > 0
                  and int(metrics.get("completed_expiry_count") or 0)
                      == completed_count
                  and completed_count >= 1
                  and metrics.get("invalid_segment_count") == 0
                  and metrics.get("episode_invalid_count") == 0
                  and closed_loop_section.get("demo_activation_authorized") is False
                  and closed_loop_section.get("live_activation_authorized") is False
                  and closed_loop_section.get("authoritative_for_integrator_promotion") is False
              )
              economics = {
                  "eligible_snapshots": eligible,
                  "successful_polls": successful_polls,
                  "checksum_bound_seconds": replay.get("checksum_bound_seconds"),
                  "valid_segments": replay.get("valid_segment_count"),
                  "delivery_evidence_count": report.get("delivery_evidence_count"),
                  "evaluated_now_epoch_ms": evaluated_now,
                  "pending_entries": pending_entries,
                  "completed_expiries": completed_count,
                  "pending_or_missed_count": primary_summary.get(
                      "pending_or_missed_count"
                  ),
                  "decision": report.get("decision"),
                  "episode_states": [
                      {
                          key: row.get(key)
                          for key in (
                              "delivery_time_epoch_ms", "target_dte_days",
                              "state", "entry_timestamp_epoch_ms", "reason",
                          )
                      }
                      for row in primary_episodes
                      if isinstance(row, dict)
                  ],
                  "summary": {
                      key: primary_summary.get(key)
                      for key in (
                          "gross_mean_bps", "base_mean_bps", "stress_mean_bps",
                          "stress_lcb_bps", "stress_ucb_bps",
                          "positive_expiry_ratio", "worst_expiry_bps",
                      )
                  },
                  "episodes": [
                      {
                          key: row.get(key)
                          for key in (
                              "delivery_time_epoch_ms", "entry_timestamp_epoch_ms",
                              "strike", "delivery_price", "gross_pnl_usdt",
                              "option_spread_cost_usdt", "option_fee_usdt",
                              "delivery_fee_usdt", "hedge_gross_pnl_usdt",
                              "hedge_spread_cost_usdt", "hedge_fee_usdt",
                              "stress_increment_usdt", "base_net_pnl_usdt",
                              "stress_net_pnl_usdt", "gross_bps", "base_net_bps",
                              "stress_net_bps", "identity_residual_usdt",
                              "residual_hedge_quantity_btc",
                          )
                      }
                      for row in completed
                  ],
              }
              print("METRIC_OPTION_V2=" + json.dumps(
                  economics, sort_keys=True, separators=(",", ":")
              ))
          except (OSError, ValueError, TypeError, KeyError):
              pass

          for name, passed in checks.items():
              print(f"{name}={'PASS' if passed else 'FAIL'}")
          PY
          exit 0
          REMOTE
          remote_status=$?
          set -e
          if (( remote_status != 0 )); then
            echo "REMOTE_COMMAND=FAIL_${remote_status}" >> release_checks
          fi

          failures=0
          while IFS='=' read -r check result; do
            [[ -n "${check}" && -n "${result}" ]] || continue
            case "${check}" in
              METRIC_*)
                echo "::notice title=ECS release audit metric::${check}=${result}"
                continue
                ;;
            esac
            case "${result}" in
              PASS|ABSENT)
                echo "::notice title=ECS release audit::check=${check}; result=${result}"
                ;;
              *)
                echo "::error title=ECS release audit::check=${check}; result=${result}"
                failures=$((failures + 1))
                ;;
            esac
          done < release_checks
          if (( failures > 0 || remote_status != 0 )); then
            exit 2
          fi

      - name: Verify option v2 report complete
        if: always()
        run: grep -Fxq 'OPTION_V2_REPORT_COMPLETE=PASS' release_checks

      - name: Verify option v2 frozen identity
        if: always()
        run: grep -Fxq 'OPTION_V2_POLICY_IDENTITY=PASS' release_checks

      - name: Verify option v2 poststart clock
        if: always()
        run: grep -Fxq 'OPTION_V2_POSTSTART_CLOCK=PASS' release_checks

      - name: Verify option v2 eligible valid evidence
        if: always()
        run: grep -Fxq 'OPTION_V2_ELIGIBLE_VALID=PASS' release_checks

      - name: Verify option v2 settled episode
        if: always()
        run: grep -Fxq 'OPTION_V2_SETTLED_EPISODE=PASS' release_checks

      - name: Verify option v2 payoff identity
        if: always()
        run: grep -Fxq 'OPTION_V2_PAYOFF_IDENTITY=PASS' release_checks

      - name: Verify option v2 WAIT decision
        if: always()
        run: grep -Fxq 'OPTION_V2_DECISION_WAIT=PASS' release_checks

      - name: Verify option v2 non-promotional state
        if: always()
        run: grep -Fxq 'OPTION_V2_NONPROMOTIONAL=PASS' release_checks

      - name: Verify option v2 summary routing
        if: always()
        run: grep -Fxq 'OPTION_V2_SUMMARY_ROUTED=PASS' release_checks
