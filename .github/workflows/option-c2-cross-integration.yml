name: Option C2 Cross Integration

on:
  workflow_dispatch:
  push:
    branches:
      - research/c2-cross-integration
    paths:
      - .github/workflows/option-c2-cross-integration.yml
      - tools/audit_bybit_cross_account.py
      - tools/collect_bybit_c2_market.py
      - tools/audit_option_c2_integration.py
      - tools/test_audit_bybit_cross_account.py
      - tools/test_collect_bybit_c2_market.py
      - tools/test_audit_option_c2_integration.py

permissions:
  contents: read

concurrency:
  group: option-c2-cross-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test account arithmetic, history and integration
        run: |
          python3 tools/test_audit_bybit_cross_account.py
          python3 tools/test_collect_bybit_c2_market.py
          python3 tools/test_audit_option_c2_integration.py
      - name: Bind complete executable bundle
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          sha256sum tools/audit_bybit_cross_account.py tools/audit_bybit_readonly_evidence.py \
            tools/audit_option_subaccount_ledger.py tools/bybit_cross_margin_reference.py \
            tools/collect_bybit_c2_market.py tools/audit_option_c2_integration.py > .artifacts/c2-bundle.sha256
          echo "bundle=$(sha256sum .artifacts/c2-bundle.sha256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Copy independent research bundle without changing release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || 22 }}
          fingerprint: ${{ secrets.ECS_HOST_FINGERPRINT }}
          source: tools/audit_bybit_cross_account.py,tools/audit_bybit_readonly_evidence.py,tools/audit_option_subaccount_ledger.py,tools/bybit_cross_margin_reference.py,tools/collect_bybit_c2_market.py,tools/audit_option_c2_integration.py,.artifacts/c2-bundle.sha256
          target: /opt/ai-trade/data/research/c2_cross_runner/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Reconstruct pinned C2 account with public history
        shell: bash
        env:
          AUDIT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          BUNDLE_SHA: ${{ steps.identity.outputs.bundle }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_PORT: ${{ secrets.ECS_PORT || 22 }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_FINGERPRINT: ${{ secrets.ECS_HOST_FINGERPRINT || vars.ECS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          umask 077
          [[ "${AUDIT_RUN_ID}" =~ ^[0-9]+-[0-9]+$ && "${BUNDLE_SHA}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${ECS_HOST}" =~ ^[a-zA-Z0-9.:-]+$ && "${ECS_USER}" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "${ECS_PORT}" =~ ^[0-9]+$ ]]
          KEY_DIR="$(mktemp -d "${RUNNER_TEMP}/c2-cross-XXXXXX")"
          trap 'rm -f "${KEY_DIR}/key" "${KEY_DIR}/known_hosts"; rmdir "${KEY_DIR}"' EXIT
          printf '%s\n' "${ECS_SSH_KEY}" > "${KEY_DIR}/key"
          sed -i 's/\r$//' "${KEY_DIR}/key"
          ssh-keygen -y -f "${KEY_DIR}/key" >/dev/null
          ssh-keyscan -p "${ECS_PORT}" -t ed25519,ecdsa,rsa "${ECS_HOST}" > "${KEY_DIR}/known_hosts" 2>/dev/null
          if [[ -n "${ECS_FINGERPRINT}" ]]; then
            ssh-keygen -lf "${KEY_DIR}/known_hosts" | awk '{print $2}' | grep -Fxq "${ECS_FINGERPRINT}"
          fi
          remote_exit=0
          ssh -i "${KEY_DIR}/key" -p "${ECS_PORT}" \
            -o UserKnownHostsFile="${KEY_DIR}/known_hosts" -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 "${ECS_USER}@${ECS_HOST}" \
            "bash -s -- ${AUDIT_RUN_ID} ${BUNDLE_SHA}" \
            > .artifacts/c2-summary.json <<'REMOTE' || remote_exit=$?
          set -euo pipefail
          umask 077
          export PYTHONDONTWRITEBYTECODE=1
          run_id="$1"
          bundle_sha="$2"
          runner="/opt/ai-trade/data/research/c2_cross_runner/${run_id}"
          cd "${runner}"
          printf '%s  %s\n' "${bundle_sha}" .artifacts/c2-bundle.sha256 | sha256sum -c - >/dev/null
          sha256sum -c .artifacts/c2-bundle.sha256 >/dev/null
          # Reuse the public capture retained by the first real run. Never
          # overwrite it or refetch current rules between defect-repair runs.
          capture_root=/opt/ai-trade/data/research/c2_cross_public/34801292053-1
          mapfile -t captures < <(find "${capture_root}" -mindepth 2 -maxdepth 2 -type f -name manifest.json)
          [[ "${#captures[@]}" == 1 ]]
          market_capture="$(dirname "${captures[0]}")"
          market_sha="$(sha256sum "${captures[0]}" | cut -d ' ' -f 1)"
          [[ "${market_sha}" == 187ab711a6fe675e5302b92356d952844a16df4de2ff9b44227cce70af97a575 ]]
          python3 tools/audit_option_c2_integration.py \
            --ledger /opt/ai-trade/data/reports/option_lifecycle_v4/option-lifecycle-v4-34759528652-1/first.ledger-input.json \
            --ledger-sha256 4c642dc0a55b3caed712abce6016ffcbb9f56a078a4b81e211b1b37499ea7491 \
            --market-capture "${market_capture}" --market-sha256 "${market_sha}" \
            --trace-output "/opt/ai-trade/data/research/c2_cross_results/${run_id}/first.reference-trace.json"
          REMOTE
          echo "remote_exit=${remote_exit}"
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          path = pathlib.Path('.artifacts/c2-summary.json')
          if not 0 < path.stat().st_size < 30000:
              raise SystemExit('No bounded C2 integration summary')
          report = json.loads(path.read_text())
          allowed = {'schema_version', 'status', 'reason', 'stage', 'code_locations', 'ledger_canonical_sha256', 'market_manifest_sha256',
              'ledger_events', 'model_checkpoints', 'pending_order_checks',
              'reversal_fills_split_without_changing_total_qty_or_fee', 'funding_boundaries',
              'funding_cash_low_usdt', 'funding_cash_high_usdt', 'base_pnl_usdt',
              'base_plus_funding_low_usdt', 'base_plus_funding_high_usdt', 'peak_imr_reference',
              'peak_mmr_reference', 'minimum_risk_headroom_usd', 'risk_review_checkpoints',
              'max_abs_nav_difference_from_frozen_mark_basis_usdt', 'public_option_mark_valuations',
              'fx_scenario_usdt_usd', 'source_ledger_status', 'source_ledger_missing_evidence',
              'historical_qualification_gaps', 'order_model', 'source_ledger_unchanged',
              'funding_amounts_qualified', 'historical_margin_qualified', 'c2_qualified',
              'candidate_state', 'forward_started', 'authorities', 'ledger_file_sha256',
              'trace_sha256', 'engine_sha256', 'cross_engine_sha256', 'reference_engine_sha256',
              'ledger_engine_sha256', 'market_source'}
          report = {k: v for k, v in report.items() if k in allowed}
          if report.get('status') == 'C2_REFERENCE_INTEGRATED_NOT_QUALIFIED':
              for field, name in [('engine_sha256', 'audit_option_c2_integration.py'),
                      ('cross_engine_sha256', 'audit_bybit_cross_account.py'),
                      ('reference_engine_sha256', 'bybit_cross_margin_reference.py'),
                      ('ledger_engine_sha256', 'audit_option_subaccount_ledger.py')]:
                  if report.get(field) != hashlib.sha256((pathlib.Path('tools') / name).read_bytes()).hexdigest():
                      raise SystemExit('C2 engine identity mismatch')
              if report.get('ledger_file_sha256') != '4c642dc0a55b3caed712abce6016ffcbb9f56a078a4b81e211b1b37499ea7491':
                  raise SystemExit('C2 source ledger mismatch')
              if report.get('c2_qualified') is not False or report.get('source_ledger_unchanged') is not True:
                  raise SystemExit('C2 qualification boundary changed')
          # GitHub truncates each annotation at 4096 bytes. Preserve exact
          # numeric text and the complete report in hash-bound small chunks.
          rendered = json.dumps(report, sort_keys=True, separators=(',', ':'))
          digest = hashlib.sha256(rendered.encode()).hexdigest()
          chunks = [rendered[i:i + 1400] for i in range(0, len(rendered), 1400)]
          for index, chunk in enumerate(chunks):
              envelope = json.dumps({'schema': 'c2_annotation_chunk_v1', 'part': index,
                  'total': len(chunks), 'sha256': digest, 'text': chunk}, separators=(',', ':'))
              assert len(envelope.encode()) < 3500
              envelope = envelope.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=C2 Cross integration {index + 1}/{len(chunks)}::' + envelope)
          if report.get('status') != 'C2_REFERENCE_INTEGRATED_NOT_QUALIFIED':
              raise SystemExit('C2 integration incomplete')
          PY
          [[ "${remote_exit}" == 0 ]]
      # Only aggregate counterfactual diagnostics leave ECS, never raw account
      # data or credentials. No production restart, account call or trading.
