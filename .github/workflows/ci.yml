name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-research.txt

      - name: Install Python Test Dependencies
        run: python -m pip install -r tools/requirements-research.txt

      - name: Install Build Dependencies
        run: |
          set -euo pipefail
          required_packages=(
            build-essential cmake ninja-build pkg-config
            libcurl4-openssl-dev libssl-dev
          )
          missing_packages=()
          for package in "${required_packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "${package}" 2>/dev/null \
              | grep -Fxq 'install ok installed'; then
              missing_packages+=("${package}")
            fi
          done
          if (( ${#missing_packages[@]} == 0 )); then
            echo "build dependencies already installed"
          else
            for attempt in 1 2 3; do
              if timeout 180s bash -c '
                set -euo pipefail
                apt_options=(
                  -o Acquire::Retries=3
                  -o Acquire::ForceIPv4=true
                  -o Acquire::http::Timeout=30
                  -o Acquire::https::Timeout=30
                )
                sudo apt-get update "${apt_options[@]}"
                sudo apt-get install -y --no-install-recommends \
                  "${apt_options[@]}" "$@"
              ' bash "${missing_packages[@]}"; then
                break
              fi
              if [[ "${attempt}" -eq 3 ]]; then
                echo "apt dependency install failed after ${attempt} attempts" >&2
                exit 1
              fi
              sleep "$((attempt * 5))"
            done
          fi

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Verify Required Tests Registered
        run: |
          set -euo pipefail
          ctest --test-dir build -N > /tmp/ctest-list.txt
          grep -q "trade_system_test" /tmp/ctest-list.txt
          grep -q "assess_run_log_test" /tmp/ctest-list.txt
          grep -q "compose_consistency_test" /tmp/ctest-list.txt
          grep -q "materialize_release_compose_test" /tmp/ctest-list.txt
          grep -q "validate_deploy_gate_test" /tmp/ctest-list.txt
          grep -q "release_integrity_test" /tmp/ctest-list.txt
          grep -q "prune_release_storage_test" /tmp/ctest-list.txt
          grep -q "evaluate_smoke_freshness_test" /tmp/ctest-list.txt
          grep -q "evaluate_demo_incubation_test" /tmp/ctest-list.txt
          grep -q "watchdog_utils_test" /tmp/ctest-list.txt
          grep -q "recycle_artifacts_test" /tmp/ctest-list.txt
          grep -q "docker_gc_test" /tmp/ctest-list.txt
          grep -q "validate_reports_test" /tmp/ctest-list.txt
          grep -q "build_closed_loop_report_test" /tmp/ctest-list.txt
          grep -q "data_pipeline_tools_test" /tmp/ctest-list.txt
          grep -q "fetch_market_alpha_history_test" /tmp/ctest-list.txt
          grep -q "fetch_bybit_trade_history_test" /tmp/ctest-list.txt
          grep -q "collect_bybit_microstructure_test" /tmp/ctest-list.txt
          grep -q "collect_binance_microstructure_test" /tmp/ctest-list.txt
          grep -q "binance_microstructure_runtime_test" /tmp/ctest-list.txt
          grep -q "prune_microstructure_capture_test" /tmp/ctest-list.txt
          grep -q "cross_venue_information_set_experiment_test" /tmp/ctest-list.txt
          grep -q "collect_bybit_liquidations_test" /tmp/ctest-list.txt
          grep -q "liquidation_capture_runtime_test" /tmp/ctest-list.txt
          grep -q "liquidation_information_set_experiment_test" /tmp/ctest-list.txt
          grep -q "maker_execution_opportunity_experiment_test" /tmp/ctest-list.txt
          grep -q "cross_asset_residual_opportunity_experiment_test" /tmp/ctest-list.txt
          grep -q "funding_basis_carry_opportunity_experiment_test" /tmp/ctest-list.txt
          grep -q "cross_venue_funding_differential_experiment_test" /tmp/ctest-list.txt
          grep -q "maker_execution_learnability_experiment_test" /tmp/ctest-list.txt
          grep -q "maker_subsecond_information_experiment_test" /tmp/ctest-list.txt
          grep -q "run_market_alpha_development_test" /tmp/ctest-list.txt
          grep -q "run_microstructure_alpha_development_test" /tmp/ctest-list.txt
          grep -q "run_microstructure_alpha_lifecycle_test" /tmp/ctest-list.txt
          grep -q "run_data_pipeline_test" /tmp/ctest-list.txt
          grep -q "feature_parity_contract_test" /tmp/ctest-list.txt
          grep -q "web_report_store_test" /tmp/ctest-list.txt
          grep -q "web_governance_test" /tmp/ctest-list.txt
          grep -q "web_static_test" /tmp/ctest-list.txt

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure
